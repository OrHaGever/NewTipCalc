```html
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>מחשבון חלוקת טיפים</title>

  <style>
    :root{
      --bg:#f7f8fa;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --primary:#0d6efd;
      --danger:#dc3545;
      --warn:#fd7e14;
      --ok:#198754;
      --border:#e5e7eb;
      --radius:12px;
      --shadow:0 1px 4px rgba(0,0,0,.06);
      --touch:52px;
      --fab-h:64px;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,sans-serif;
      padding:
        env(safe-area-inset-top)
        16px
        calc(140px + env(safe-area-inset-bottom))
        16px;
      max-width:720px;
      margin-inline:auto;
      scroll-padding-bottom:120px;
    }

    h1{
      text-align:center;
      margin:1rem 0;
      font-size:1.5rem;
    }

    h3{
      text-align:center;
      margin:.2rem 0 .8rem;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:1rem;
      margin-bottom:1rem;
      box-shadow:var(--shadow);
    }

    .row{
      display:flex;
      gap:.8rem;
      flex-wrap:wrap;
      align-items:center;
    }

    .row > *{
      flex:1;
    }

    label{
      display:block;
    }

    input[type="text"],
    input[type="number"]{
      width:100%;
      height:var(--touch);
      border:1px solid var(--border);
      border-radius:10px;
      padding:.7rem;
      font-size:16px;
      background:#fff;
      color:#111827;
    }

    input[type="checkbox"],
    input[type="radio"]{
      cursor:pointer;
    }

    .tag{
      display:inline-block;
      border:1px solid var(--border);
      border-radius:999px;
      padding:.25rem .6rem;
      font-size:.85rem;
      color:var(--muted);
    }

    .btn{
      border:none;
      border-radius:999px;
      background:var(--primary);
      color:#fff;
      cursor:pointer;
      font-weight:600;
      height:var(--touch);
      padding:0 1rem;
    }

    .btn-outline{
      background:transparent;
      border:1px solid var(--primary);
      color:var(--primary);
    }

    .btn-ghost{
      background:transparent;
      border:1px solid var(--danger);
      color:var(--danger);
    }

    .btn-small{
      height:42px;
    }

    .group{
      border:1px dashed var(--border);
      border-radius:10px;
      padding:.7rem;
      margin-bottom:.7rem;
      transition:.15s;
    }

    .person{
      display:grid;
      grid-template-columns:1.2fr .7fr .8fr .8fr auto;
      gap:.5rem;
      align-items:center;
      padding:.5rem;
      border:1px solid var(--border);
      border-radius:10px;
    }

    .actions-inline{
      display:flex;
      justify-content:flex-end;
    }

    .summary{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
      gap:.6rem;
    }

    .kpi{
      border:1px solid var(--border);
      border-radius:10px;
      padding:.7rem;
    }

    .kpi b{
      display:block;
      margin-top:.3rem;
      font-size:1.05rem;
    }

    .fab{
      position:fixed;
      left:18px;
      right:18px;
      bottom:18px;
      z-index:10;
      padding-bottom:env(safe-area-inset-bottom);
    }

    .fab .btn{
      width:100%;
      min-height:var(--fab-h);
    }

    .row-good{
      background:rgba(25,135,84,.08);
      border-right:4px solid var(--ok);
    }

    .row-warn{
      background:rgba(253,126,20,.08);
      border-right:4px solid var(--warn);
    }

    .row-bad{
      background:rgba(220,53,69,.08);
      border-right:4px solid var(--danger);
    }

    .muted{
      color:var(--muted);
    }

    .sep{
      height:1px;
      background:var(--border);
      margin:1rem 0;
    }

    .bottom-spacer{
      height:120px;
    }

    .disabled-option{
      opacity:.45;
      pointer-events:none;
    }

    .toggle-row{
      display:flex;
      gap:1rem;
      flex-wrap:wrap;
      align-items:center;
      margin-top:.9rem;
    }

    .toggle-label{
      display:flex;
      align-items:center;
      gap:.5rem;
      cursor:pointer;
      user-select:none;
    }

    @media(max-width:560px){

      .person{
        grid-template-columns:1fr 1fr;
      }

      .actions-inline{
        grid-column:1/-1;
        justify-content:flex-start;
      }
    }
  </style>
</head>

<body>

<h1>מחשבון חלוקת טיפים</h1>

<!-- הגדרות כלליות -->
<div class="card">

  <div class="row">

    <div>
      <label for="totalTip">סה"כ טיפים (₪)</label>

      <input
        id="totalTip"
        type="number"
        step="0.01"
        inputmode="decimal"
        placeholder="2450"
      >
    </div>

  </div>

  <div class="toggle-row">

    <label class="toggle-label">

      <input
        id="enableBarCut"
        type="checkbox"
        checked
        onchange="toggleWeekendState()"
      >

      <span class="tag">
        הפרשה לבר
      </span>

    </label>

    <label
      id="weekendWrapper"
      class="toggle-label"
    >

      <input
        id="isWeekend"
        type="checkbox"
      >

      <span class="tag">
        סופ"ש (15%)
      </span>

    </label>

  </div>

</div>

<!-- ברמנים -->
<div class="card">

  <h3>ברמנים</h3>

  <div id="barContainer"></div>

  <button
    class="btn btn-outline btn-small"
    onclick="addWorker('bar')"
  >
    ➕ הוסף ברמן
  </button>

</div>

<!-- מלצרים -->
<div class="card">

  <h3>מלצרים</h3>

  <div id="waiterContainer"></div>

  <button
    class="btn btn-outline btn-small"
    onclick="addWorker('waiter')"
  >
    ➕ הוסף מלצר
  </button>

</div>

<!-- סיכום -->
<div class="card">

  <div class="summary">

    <div class="kpi">
      <span class="muted">סה"כ טיפ</span>
      <b id="kpiTotal">₪0.00</b>
    </div>

    <div class="kpi">
      <span class="muted">לבר</span>
      <b id="kpiBar">₪0.00</b>
    </div>

    <div class="kpi">
      <span class="muted">למסעדה</span>
      <b id="kpiRest">₪0.00</b>
    </div>

    <div class="kpi">
      <span class="muted">נטו מלצרים</span>
      <b id="kpiWaiters">₪0.00</b>
    </div>

    <div class="kpi">
      <span class="muted">ש"ש ממוצע</span>
      <b id="kpiAvgHr">₪0.00</b>
    </div>

  </div>

  <div class="sep"></div>

  <div id="results"></div>

</div>

<div class="bottom-spacer"></div>

<div class="fab">

  <button
    class="btn"
    onclick="calculateTips()"
  >
    חשב חלוקה
  </button>

</div>

<script>

const money = n =>
  new Intl.NumberFormat(
    'he-IL',
    {
      style:'currency',
      currency:'ILS',
      maximumFractionDigits:2
    }
  ).format(+n || 0);

let barCount = 0;
let waiterCount = 0;

window.addEventListener('DOMContentLoaded', ()=>{

  addWorker('bar');
  addWorker('waiter');

  toggleWeekendState();
});

function toggleWeekendState(){

  const enableBarCut =
    document.getElementById('enableBarCut').checked;

  const weekend =
    document.getElementById('isWeekend');

  const wrapper =
    document.getElementById('weekendWrapper');

  if(!enableBarCut){

    weekend.checked = false;
    weekend.disabled = true;

    wrapper.classList.add('disabled-option');

  }else{

    weekend.disabled = false;

    wrapper.classList.remove('disabled-option');
  }
}

function addWorker(type){

  const container =
    document.getElementById(type + 'Container');

  const id =
    type === 'bar'
      ? barCount++
      : waiterCount++;

  const wrap =
    document.createElement('div');

  wrap.className = 'group';

  wrap.innerHTML = `

    <div class="person">

      <input
        type="text"
        placeholder="שם"
        id="${type}Name${id}"
      >

      <input
        type="number"
        step="0.01"
        inputmode="decimal"
        placeholder="שעות"
        id="${type}Hours${id}"
      >

      <label
        class="toggle-label"
        style="justify-content:flex-start"
      >

        <input
          type="checkbox"
          id="${type}HasStars${id}"
          onchange="toggleStars('${type}',${id})"
        >

        כוכבים

      </label>

      <div class="muted">
        ברירת מחדל 6⭐
      </div>

      <div class="actions-inline">

        <button
          class="btn btn-ghost btn-small"
          onclick="this.closest('.group').remove()"
        >
          🗑️
        </button>

      </div>

    </div>

    <div
      class="row"
      id="${type}StarsOptions${id}"
      style="display:none;margin-top:.7rem"
    >

      <label>
        <input type="radio" name="${type}Stars${id}" value="3">
        3⭐
      </label>

      <label>
        <input type="radio" name="${type}Stars${id}" value="4">
        4⭐
      </label>

      <label>
        <input type="radio" name="${type}Stars${id}" value="5">
        5⭐
      </label>

      <label>
        <input
          type="radio"
          name="${type}Stars${id}"
          value="6"
          checked
        >
        6⭐
      </label>

    </div>
  `;

  container.appendChild(wrap);
}

function toggleStars(type,id){

  const el =
    document.getElementById(
      `${type}StarsOptions${id}`
    );

  const visible =
    getComputedStyle(el).display !== 'none';

  el.style.display =
    visible
      ? 'none'
      : 'flex';
}

function getWorkers(type){

  const container =
    document.getElementById(type + 'Container');

  const groups =
    container.querySelectorAll('.group');

  const out = [];

  groups.forEach((g,i)=>{

    const name =
      g.querySelector(`input[id^='${type}Name']`)
      ?.value
      ?.trim()
      || `עובד ${i+1}`;

    let hours =
      parseFloat(
        g.querySelector(`input[id^='${type}Hours']`)
        ?.value
      ) || 0;

    hours =
      Math.min(
        Math.max(hours,0),
        24
      );

    let stars = 6;

    const hasStars =
      g.querySelector(`input[id^='${type}HasStars']`)
      ?.checked;

    if(hasStars){

      const selected =
        g.querySelector(
          `input[name^='${type}Stars']:checked`
        );

      if(selected){
        stars = parseInt(selected.value,10);
      }
    }

    if(hours > 0){

      out.push({
        name,
        hours,
        stars,
        node:g
      });
    }
  });

  return out;
}

function calculateTips(){

  document.querySelectorAll('.group').forEach(el=>{

    el.classList.remove(
      'row-good',
      'row-warn',
      'row-bad'
    );
  });

  const totalTip =
    Math.max(
      0,
      parseFloat(
        document.getElementById('totalTip').value
      ) || 0
    );

  const isWeekend =
    document.getElementById('isWeekend').checked;

  const enableBarCut =
    document.getElementById('enableBarCut').checked;

  const barPct =
    enableBarCut
      ? (isWeekend ? 0.15 : 0.12)
      : 0;

  const barWorkers =
    getWorkers('bar');

  const waiters =
    getWorkers('waiter');

  const totalWaiterHours =
    waiters.reduce(
      (s,w)=>s+w.hours,
      0
    );

  if(totalTip <= 0 || totalWaiterHours <= 0){

    renderKpis({
      totalTip,
      barTip:0,
      restCut:0,
      finalWaiters:0,
      avgHourly:0,
      barPct,
      restPct:0
    });

    document.getElementById('results').innerHTML = `
      <div class="muted">
        נא להזין טיפ חיובי ולפחות מלצר אחד עם שעות.
      </div>
    `;

    return;
  }

  const barTip =
    totalTip * barPct;

  const remainingAfterBar =
    totalTip - barTip;

  const avgHourlyWith =
    p =>
      (
        remainingAfterBar * (1-p)
      ) / totalWaiterHours;

  let restPct;

  if(avgHourlyWith(0.20) >= 100){

    restPct = 0.20;

  }else if(avgHourlyWith(0.17) >= 90){

    restPct = 0.17;

  }else{

    restPct = 0.15;
  }

  const restCut =
    remainingAfterBar * restPct;

  const finalForWaiters =
    remainingAfterBar - restCut;

  const effWaiters =
    waiters.reduce(
      (s,w)=>s + w.hours*w.stars,
      0
    );

  const perEffWaiter =
    effWaiters
      ? finalForWaiters / effWaiters
      : 0;

  const waiterPays =
    waiters.map(w=>({

      ...w,

      pay:
        w.hours *
        w.stars *
        perEffWaiter,

      rate:
        w.hours
          ? (
            w.hours *
            w.stars *
            perEffWaiter
          ) / w.hours
          : 0
    }));

  const effBar =
    barWorkers.reduce(
      (s,w)=>s + w.hours*w.stars,
      0
    );

  const perEffBar =
    effBar
      ? barTip / effBar
      : 0;

  const barPays =
    barWorkers.map(w=>({

      ...w,

      pay:
        w.hours *
        w.stars *
        perEffBar,

      rate:
        w.hours
          ? (
            w.hours *
            w.stars *
            perEffBar
          ) / w.hours
          : 0
    }));

  const avgHourly =
    finalForWaiters / totalWaiterHours;

  renderKpis({
    totalTip,
    barTip,
    barPct,
    restCut,
    restPct,
    finalWaiters:finalForWaiters,
    avgHourly
  });

  const results = [];

  if(waiterPays.length){

    results.push(`
      <div
        class="muted"
        style="margin-bottom:.5rem"
      >
        מלצרים
      </div>
    `);

    waiterPays.forEach(w=>{

      const cls =
        classifyRow(
          w.rate,
          avgHourly
        );

      w.node.classList.add(cls);

      results.push(
        rowHTML(
          w.name,
          w.hours,
          w.stars,
          w.rate,
          w.pay,
          cls
        )
      );
    });
  }

  if(barPays.length){

    results.push(`
      <div
        class="muted"
        style="margin:.9rem 0 .5rem"
      >
        ברמנים
      </div>
    `);

    barPays.forEach(w=>{

      results.push(
        rowHTML(
          w.name,
          w.hours,
          w.stars,
          w.rate,
          w.pay,
          ''
        )
      );
    });
  }

  document.getElementById('results').innerHTML =
    results.join('');
}

function classifyRow(rate,avg,tol=0.05){

  if(avg <= 0){
    return '';
  }

  if(rate >= avg*(1+tol)){
    return 'row-good';
  }

  if(rate <= avg*(1-tol)){
    return 'row-bad';
  }

  return 'row-warn';
}

function rowHTML(
  name,
  hours,
  stars,
  rate,
  pay,
  cls
){

  return `
    <div class="person ${cls || ''}">

      <div>
        <b>${escapeHTML(name)}</b>
      </div>

      <div>
        שעות: ${hours}
      </div>

      <div>
        ⭐ ${stars}
      </div>

      <div>
        ש"ש: ${money(rate)}
      </div>

      <div>
        סה"כ: ${money(pay)}
      </div>

    </div>
  `;
}

function renderKpis({

  totalTip,
  barTip,
  barPct,
  restCut,
  restPct,
  finalWaiters,
  avgHourly

}){

  document.getElementById('kpiTotal').textContent =
    money(totalTip);

  document.getElementById('kpiBar').textContent =
    `${money(barTip)} (${(barPct*100).toFixed(0)}%)`;

  document.getElementById('kpiRest').textContent =
    `${money(restCut)} (${(restPct*100).toFixed(0)}%)`;

  document.getElementById('kpiWaiters').textContent =
    money(finalWaiters);

  document.getElementById('kpiAvgHr').textContent =
    money(avgHourly);
}

function escapeHTML(s){

  return (s || '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );
}

</script>

</body>
</html>
