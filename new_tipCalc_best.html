<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <!-- מונע זום אוטומטי במובייל + מבטל זום ידני (לפי הבקשה) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>מחשבון חלוקת טיפים — מובייל</title>
  <style>
    :root{
      --bg:#f6f7f9;--fg:#1f2328;--card:#ffffff;--muted:#6a737d;--accent:#0d6efd;
      --ok:#198754;--warn:#fd7e14;--err:#dc3545;--border:#d0d7de;
      --gap:.9rem; --touch:52px; --radius:12px;
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#0b0f14; --fg:#e5e7eb; --card:#0f141b; --muted:#9aa3af; --border:#1f2937; }
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(90px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
      background:var(--bg); color:var(--fg);
      font:400 16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,Helvetica,sans-serif;
      max-width:820px; margin-inline:auto;
    }
    h1{margin:1rem 0 .5rem;text-align:center;font-size:1.35rem}
    h3{margin:.2rem 0 .6rem}
    .container{padding:var(--gap)}
    .group{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--gap);margin-bottom:.8rem}
    .row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
    .row > *{flex:1}
    label{display:block;margin:.25rem 0 .2rem;font-size:.95rem}

    /* קלטים: מינימום 16px כדי למנוע זום; לבן/שחור בכל מצב */
    input,select,button{
      font-size:16px;
    }
    input[type="number"], input[type="text"], select{
      width:100%;height:var(--touch);
      border:1px solid var(--border);border-radius:10px;
      padding:.6rem .75rem;background:#ffffff !important;color:#111827 !important;caret-color:#111827;
    }
    ::placeholder{color:#6b7280}
    input[type="checkbox"]{inline-size:1.2rem; block-size:1.2rem}

    .btn{height:var(--touch);border:none;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;padding:0 1rem}
    .btn-outline{background:#fff;color:var(--accent);border:1px solid var(--accent)}
    .remove{background:transparent;color:var(--err);border:1px solid var(--err);border-radius:999px;height:40px;padding:0 .8rem}
    .actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem}
    .pill{display:inline-block;padding:.15rem .5rem;border:1px solid var(--border);border-radius:999px;font-size:.85rem;color:var(--muted)}
    .hr{border:none;border-top:1px solid var(--border);margin:.9rem 0}

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.6rem}

    /* סימון אינטואיטיבי לשורות לפי יחס לממוצע (±5%) */
    .row-good{background:linear-gradient(0deg, rgba(25,135,84,.06), rgba(25,135,84,.06)); border-left:4px solid var(--ok)}
    .row-warn{background:linear-gradient(0deg, rgba(253,126,20,.07), rgba(253,126,20,.07)); border-left:4px solid var(--warn)}
    .row-bad {background:linear-gradient(0deg, rgba(220,53,69,.07), rgba(220,53,69,.07)); border-left:4px solid var(--err)}

    .table{width:100%;border-collapse:collapse;margin-top:.8rem}
    .table th,.table td{border:1px solid var(--border);padding:.45rem;text-align:start}

    /* כפתור חישוב צף + מרווח ביטחון בתחתית */
    .fab{position:fixed;left:18px;right:18px;bottom:18px;z-index:9}
    .fab .btn{width:100%}
    .bottom-spacer{height:100px}

    .muted{color:var(--muted)}
  </style>
</head>
<body>
<div class="container">
  <h1>מחשבון חלוקת טיפים — מובייל</h1>

  <div class="group">
    <div class="grid">
      <div>
        <label>סה"כ טיפים (₪)</label>
        <input type="number" id="totalTip" min="0" step="0.01" placeholder="לדוגמה: 2450" />
      </div>
      <div>
        <label>סופ"ש?</label>
        <div class="row">
          <input type="checkbox" id="isWeekend" />
          <span class="pill">משפיע רק על % בר (12/15)</span>
        </div>
      </div>
      <div>
        <label>% בר חול</label>
        <input type="number" id="barPctWeek" min="0" max="100" step="0.1" value="12">
      </div>
      <div>
        <label>% בר סופ"ש</label>
        <input type="number" id="barPctWeekend" min="0" max="100" step="0.1" value="15">
      </div>
      <div>
        <label>עיגול תשלום</label>
        <select id="roundStep">
          <option value="0">ללא עיגול</option>
          <option value="0.5">0.5 ₪</option>
          <option value="1">1 ₪</option>
        </select>
      </div>
    </div>
    <div class="muted" style="margin-top:.4rem">* כלל הפרשה למסעדה: לפי ש"ש ממוצע למלצרים <b>לאחר ההפרשה</b>: ≥100 ⇒ 20%, ≥90 ⇒ 17%, אחרת 15%.</div>
  </div>

  <div class="group">
    <h3>ברמנים</h3>
    <div id="barContainer"></div>
    <div class="actions">
      <button class="btn btn-outline" onclick="addWorker('bar')">➕ הוסף ברמן</button>
    </div>
  </div>

  <div class="group">
    <h3>מלצרים</h3>
    <div id="waiterContainer"></div>
    <div class="actions">
      <button class="btn btn-outline" onclick="addWorker('waiter')">➕ הוסף מלצר</button>
    </div>
  </div>

  <div class="group" id="summary">
    <div class="grid">
      <div>סה"כ טיפ: <b id="kTotal">₪0.00</b></div>
      <div>לבר: <b id="kBar">₪0.00</b> <span class="muted" id="kBarPct">(0%)</span></div>
      <div>למסעדה: <b id="kRest">₪0.00</b> <span class="muted" id="kRestPct">(0%)</span></div>
      <div>נטו מלצרים: <b id="kWaitersNet">₪0.00</b></div>
      <div>ש"ש ממוצע למלצרים (לאחר): <b id="kAvgHr">₪0.00</b></div>
    </div>
    <div class="hr"></div>
    <div class="right"><b>מלצרים</b></div>
    <div id="waitersTableWrap" class="muted">אין נתונים.</div>
    <div class="hr"></div>
    <div class="right"><b>ברמנים</b></div>
    <div id="barTableWrap" class="muted">אין נתונים.</div>
  </div>

  <div class="bottom-spacer" aria-hidden="true"></div>
</div>

<div class="fab"><button class="btn" onclick="calculateTips()">חשב חלוקה</button></div>

<script>
  let barIdx = 0, waiterIdx = 0;
  const fmt = (n)=> new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:2}).format(n||0);

  // ▼ יצירת כרטיסי עובדים
  function addWorker(type, data={}){
    const container = document.getElementById(type+'Container');
    const id = (type==='bar'? barIdx++ : waiterIdx++);
    const div = document.createElement('div');
    div.className='group';
    div.innerHTML = `
      <div class="row">
        <input type="text" placeholder="שם" id="${type}Name${id}" value="${data.name||''}"/>
        <input type="number" placeholder="שעות" id="${type}Hours${id}" min="0" step="0.01" value="${data.hours??''}"/>
      </div>
      <div class="row" style="align-items:center;justify-content:space-between">
        <div>
          <label><input type="checkbox" id="${type}HasStars${id}" ${data.stars? 'checked':''} onchange="toggleStars('${type}',${id})"/> כוכבים/דרגה</label>
          <div class="row" id="${type}StarsOptions${id}" style="display:${data.stars?'flex':'none'};gap:.8rem">
            <label><input type="radio" name="${type}Stars${id}" value="3"> 3⭐</label>
            <label><input type="radio" name="${type}Stars${id}" value="4"> 4⭐</label>
            <label><input type="radio" name="${type}Stars${id}" value="5"> 5⭐</label>
            <label><input type="radio" name="${type}Stars${id}" value="6" ${!data.stars || data.stars===6 ? 'checked':''}> 6⭐</label>
          </div>
          <div class="muted" style="margin-top:.2rem">אם לא מסומן — נספר כ־6⭐.</div>
        </div>
        <div class="actions" style="flex:0">
          <button class="remove" onclick="this.closest('.group').remove()">🗑️ מחק</button>
        </div>
      </div>
    `;
    container.appendChild(div);
  }

  function toggleStars(type,id){
    const box = document.getElementById(`${type}StarsOptions${id}`);
    box.style.display = (box.style.display==='none' || !box.style.display) ? 'flex' : 'none';
  }

  function getWorkers(type){
    const container = document.getElementById(type+'Container');
    const groups = container.querySelectorAll('.group');
    const out = [];
    groups.forEach((g,i)=>{
      const name = g.querySelector(`input[id^='${type}Name']`)?.value?.trim() || `עובד ${i+1}`;
      const hours = parseFloat(g.querySelector(`input[id^='${type}Hours']`)?.value||0);
      let stars = 6;
      const hasStars = g.querySelector(`input[id^='${type}HasStars']`)?.checked;
      if(hasStars){
        const sel = g.querySelector(`input[name='${type}Stars${i}']:checked`) || g.querySelector(`input[name^='${type}Stars']:checked`);
        if(sel) stars = parseInt(sel.value,10);
      }
      if(hours>0) out.push({name, hours, stars, node:g});
    });
    return out;
  }

  function roundToStep(value, step){
    if(!step || step<=0) return Math.round((value + Number.EPSILON)*100)/100;
    const k = Math.round(value/step)*step;
    return Math.round((k + Number.EPSILON)*100)/100;
  }

  // ▼ חישוב לפי כללים: אחוז מסעדה נקבע ע"י ש"ש ממוצע לאחר ההפרשה
  function calculateTips(){
    const totalTip = Math.max(0, parseFloat(document.getElementById('totalTip').value || 0));
    const isWeekend = document.getElementById('isWeekend').checked;
    const barPct = Math.max(0, Math.min(100, parseFloat((isWeekend? document.getElementById('barPctWeekend').value : document.getElementById('barPctWeek').value) || 0)));
    const roundStep = parseFloat(document.getElementById('roundStep').value || 0);

    const barWorkers = getWorkers('bar');
    const waiters = getWorkers('waiter');

    // שומרים על מגינים בסיסיים
    const totalWaiterHours = waiters.reduce((s,w)=> s + w.hours, 0);
    if(totalTip<=0 || (waiters.length===0 && barWorkers.length===0)){
      renderSummary({totalTip, barTip:0, barPct, restCut:0, restPct:0, finalForWaiters:0, perEffHour:0}, [], []);
      return;
    }

    const barTip = totalTip * (barPct/100);
    const remainingAfterBar = totalTip - barTip;

    // החלטת אחוז מסעדה לפי ש"ש ממוצע (לאחר ההפרשה)
    // avgHourly(p) = (remainingAfterBar*(1-p)) / totalWaiterHours
    let restPercent = 0.15;
    if(totalWaiterHours > 0){
      const avgWith = p => (remainingAfterBar * (1 - p)) / totalWaiterHours;
      if(avgWith(0.20) >= 100){ restPercent = 0.20; }
      else if(avgWith(0.17) >= 90){ restPercent = 0.17; }
      else { restPercent = 0.15; }
    }

    const restaurantCut = remainingAfterBar * restPercent;
    const finalForWaiters = Math.max(0, remainingAfterBar - restaurantCut);

    // חלוקת מלצרים לפי שעות*כוכבים
    const effWaiterHours = waiters.reduce((s,w)=> s + (w.hours * w.stars), 0);
    const perEffHour = effWaiterHours ? (finalForWaiters / effWaiterHours) : 0;
    const waitersAlloc = waiters.map(w => roundToStep(w.hours * w.stars * perEffHour, roundStep));

    // חלוקת בר סימטרית (שעות*כוכבים)
    const effBar = barWorkers.reduce((s,w)=> s + (w.hours * (w.stars||6)), 0);
    const perBarUnit = effBar ? (barTip / effBar) : 0;
    const barAlloc = barWorkers.map(w => roundToStep(w.hours * (w.stars||6) * perBarUnit, roundStep));

    // טבלאות + הדגשות (יחס לממוצע ש"ש לאחר ההפרשה)
    const avgHourly = (totalWaiterHours>0)? (finalForWaiters/totalWaiterHours) : 0;
    const waiterRows = waiters.map((w,i)=>({name:w.name,hours:w.hours,stars:w.stars, pay:waitersAlloc[i], rate: (w.hours? waitersAlloc[i]/w.hours : 0)}));
    const barRows = barWorkers.map((w,i)=>({name:w.name,hours:w.hours,stars:w.stars||6, pay:barAlloc[i], rate: (w.hours? barAlloc[i]/w.hours : 0)}));

    // מיון לפי סכום
    waiterRows.sort((a,b)=>b.pay-a.pay);
    barRows.sort((a,b)=>b.pay-a.pay);

    renderSummary({totalTip, barTip, barPct, restCut:restaurantCut, restPct:restPercent, finalForWaiters, perEffHour:perEffHour}, waiterRows, barRows, avgHourly);
  }

  function renderSummary(k, waiterRows, barRows, avgHourly=0){
    document.getElementById('kTotal').innerText = fmt(k.totalTip||0);
    document.getElementById('kBar').innerText = fmt(k.barTip||0);
    document.getElementById('kBarPct').innerText = `(${((k.barPct||0)).toFixed(1)}%)`;
    document.getElementById('kRest').innerText = fmt(k.restCut||0);
    document.getElementById('kRestPct').innerText = `(${((k.restPct||0)*100).toFixed(0)}%)`;
    document.getElementById('kWaitersNet').innerText = fmt(k.finalForWaiters||0);
    document.getElementById('kAvgHr').innerText = fmt(avgHourly||0);

    // מלצרים
    if((waiterRows||[]).length){
      const tol = 0.05; // ±5%
      const head = '<tr><th>שם</th><th>שעות</th><th>⭐</th><th>שכר שעתי</th><th>סכום</th></tr>';
      const body = waiterRows.map(r=>{
        const cls = (avgHourly>0)
          ? (r.rate >= avgHourly*1.05 ? 'row-good' : (r.rate <= avgHourly*0.95 ? 'row-bad' : 'row-warn'))
          : '';
        return `<tr class="${cls}"><td>${escapeHTML(r.name)}</td><td>${r.hours}</td><td>${r.stars}</td><td>${fmt(r.rate)}</td><td>${fmt(r.pay)}</td></tr>`;
      }).join('');
      document.getElementById('waitersTableWrap').innerHTML = `<table class="table">${head}${body}</table>`;
    }else{
      document.getElementById('waitersTableWrap').innerHTML = '<div class="muted">אין מלצרים.</div>';
    }

    // ברמנים
    if((barRows||[]).length){
      const head = '<tr><th>שם</th><th>שעות</th><th>⭐</th><th>שכר שעתי</th><th>סכום</th></tr>';
      const body = barRows.map(r=> `<tr><td>${escapeHTML(r.name)}</td><td>${r.hours}</td><td>${r.stars}</td><td>${fmt(r.rate)}</td><td>${fmt(r.pay)}</td></tr>`).join('');
      document.getElementById('barTableWrap').innerHTML = `<table class="table">${head}${body}</table>`;
    }else{
      document.getElementById('barTableWrap').innerHTML = '<div class="muted">אין ברמנים.</div>';
    }
  }

  function escapeHTML(s){ return (s||'').replace(/[&<>"']/g, m=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
</script>
</body>
</html>
