<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>מחשבון חלוקת טיפים</title>

  <style>
    :root{
      --bg:#f4f6f8;
      --fg:#1f2328;
      --card:#ffffff;
      --card-soft:#f8fafc;
      --muted:#68707b;
      --accent:#0d6efd;
      --accent-soft:rgba(13,110,253,.10);
      --ok:#198754;
      --err:#dc3545;
      --border:#d0d7de;
      --input-bg:#ffffff;
      --input-fg:#111827;
      --focus:rgba(13,110,253,.25);
      --shadow:0 1px 5px rgba(15,23,42,.06);
      --radius:16px;
      --touch:52px;
      --gap:.9rem;
    }

    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0b0f14;
        --fg:#e5e7eb;
        --card:#0f141b;
        --card-soft:#111827;
        --muted:#9aa3af;
        --border:#1f2937;
        --input-bg:#1b2430;
        --input-fg:#e5e7eb;
        --focus:rgba(13,110,253,.35);
        --shadow:none;
      }
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(112px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
      background:var(--bg);
      color:var(--fg);
      font:400 16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      max-width:820px;
      margin-inline:auto;
      scroll-padding-top:112px;
      scroll-padding-bottom:132px;
    }

    .container{padding:var(--gap)}

    h1{
      margin:1rem 0 .8rem;
      text-align:center;
      font-size:1.45rem;
      font-weight:800;
    }

    h3{margin:0;font-size:1.05rem}

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:var(--gap);
      margin-bottom:.85rem;
      box-shadow:var(--shadow);
    }

    .sticky-summary{
      position:sticky;
      top:env(safe-area-inset-top);
      z-index:8;
      background:color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:.65rem;
      margin-bottom:.85rem;
      box-shadow:var(--shadow);
    }

    .summary-main{
      display:grid;
      grid-template-columns:1.25fr 1fr;
      gap:.55rem;
      align-items:stretch;
    }

    .summary-box{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.7rem;
      min-width:0;
    }

    .summary-box span,
    .metric span{
      display:block;
      color:var(--muted);
      font-size:.78rem;
      margin-bottom:.18rem;
    }

    .summary-box strong{
      display:block;
      font-size:1.42rem;
      line-height:1.1;
      letter-spacing:-.02em;
    }

    .summary-box.secondary strong{font-size:1.02rem}

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:.45rem;
      margin-top:.5rem;
    }

    .metric{
      background:var(--card-soft);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.55rem;
      min-width:0;
    }

    .metric b{
      font-size:.98rem;
      overflow-wrap:anywhere;
    }

    .row{
      display:flex;
      gap:.6rem;
      align-items:center;
      flex-wrap:wrap;
    }

    .row > *{flex:1}

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
      gap:.65rem;
    }

    label{display:block;margin:.25rem 0 .25rem;font-size:.95rem}

    input,button{font-size:16px}

    input[type="number"],
    input[type="text"]{
      width:100%;
      height:var(--touch);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.65rem .8rem;
      background:var(--input-bg);
      color:var(--input-fg);
      caret-color:var(--input-fg);
    }

    input[type="text"]:focus,
    input[type="number"]:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 3px var(--focus);
    }

    ::placeholder{color:var(--muted)}

    input[type="checkbox"],
    input[type="radio"]{
      inline-size:1.2rem;
      block-size:1.2rem;
      cursor:pointer;
    }

    .toggle-row{
      display:flex;
      gap:.7rem;
      flex-wrap:wrap;
      margin-top:.75rem;
    }

    .toggle-label{
      display:flex;
      align-items:center;
      gap:.5rem;
      min-height:44px;
      padding:.45rem .65rem;
      border:1px solid var(--border);
      border-radius:999px;
      background:var(--card-soft);
      user-select:none;
      cursor:pointer;
      margin:0;
    }

    .disabled-option{
      opacity:.45;
      pointer-events:none;
    }

    .btn{
      height:var(--touch);
      border:none;
      border-radius:999px;
      background:var(--accent);
      color:#fff;
      font-weight:700;
      cursor:pointer;
      padding:0 1rem;
    }

    .btn-outline{
      background:var(--card);
      color:var(--accent);
      border:1px solid var(--accent);
    }

    .btn-plain{
      background:transparent;
      color:var(--fg);
      border:1px solid var(--border);
    }

    .actions{
      display:flex;
      gap:.5rem;
      flex-wrap:wrap;
      margin-top:.65rem;
    }

    .quick-actions{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:.45rem;
      margin-top:.6rem;
    }

    .quick-actions .btn{
      height:42px;
      padding:0 .45rem;
      font-size:.92rem;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:.7rem;
      margin-bottom:.65rem;
    }

    .section-head button{
      height:34px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--card-soft);
      color:var(--fg);
      padding:0 .7rem;
      cursor:pointer;
    }

    .section-body[hidden]{display:none}

    .worker-card{
      background:var(--card-soft);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.7rem;
      margin-bottom:.6rem;
    }

    .worker-top{
      display:grid;
      grid-template-columns:1fr 96px 40px;
      gap:.5rem;
      align-items:end;
    }

    .worker-options{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:.7rem;
      margin-top:.6rem;
      flex-wrap:wrap;
    }

    .remove{
      width:40px;
      min-width:40px;
      height:40px;
      padding:0;
      background:transparent;
      color:var(--err);
      border:1px solid var(--err);
      border-radius:999px;
      cursor:pointer;
      font-size:1.05rem;
      line-height:1;
    }

    .stars-row{
      display:flex;
      gap:.7rem;
      flex-wrap:wrap;
      margin-top:.55rem;
    }

    .stars-row .toggle-label{
      min-height:38px;
      padding:.35rem .55rem;
      background:var(--card);
    }

    .table-wrap{overflow:auto;margin-top:.55rem}

    .table{
      width:100%;
      border-collapse:separate;
      border-spacing:0 .4rem;
      min-width:520px;
    }

    .table th{
      color:var(--muted);
      font-size:.82rem;
      text-align:start;
      font-weight:700;
      padding:.25rem .55rem;
    }

    .table td{
      background:var(--card);
      border-block:1px solid var(--border);
      padding:.6rem .55rem;
      text-align:start;
    }

    .table td:first-child{border-inline-start:1px solid var(--border);border-radius:0 12px 12px 0}
    .table td:last-child{border-inline-end:1px solid var(--border);border-radius:12px 0 0 12px}

    .row-good td:first-child{border-right:4px solid var(--ok)}
    .row-bad td:first-child{border-right:4px solid var(--err)}

    .fab{
      position:fixed;
      left:18px;
      right:18px;
      bottom:18px;
      z-index:10;
      max-width:784px;
      margin:auto;
    }

    .fab .btn{width:100%;box-shadow:0 8px 28px rgba(13,110,253,.22)}

    .bottom-sheet{
      position:fixed;
      inset:auto 0 0 0;
      z-index:20;
      background:var(--card);
      border-top:1px solid var(--border);
      border-radius:22px 22px 0 0;
      box-shadow:0 -16px 50px rgba(15,23,42,.18);
      max-height:82vh;
      transform:translateY(105%);
      transition:transform .22s ease;
      padding:env(safe-area-inset-top) .9rem calc(.9rem + env(safe-area-inset-bottom));
      overflow:auto;
    }

    .bottom-sheet.open{transform:translateY(0)}

    .sheet-head{
      position:sticky;
      top:0;
      background:var(--card);
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:.7rem;
      padding:.7rem 0 .6rem;
      border-bottom:1px solid var(--border);
    }

    .sheet-head strong{font-size:1.1rem}

    .sheet-close{
      width:40px;
      height:40px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--card-soft);
      color:var(--fg);
      cursor:pointer;
      font-weight:800;
    }

    .sheet-metrics{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:.5rem;
      margin:.8rem 0;
    }

    .empty-state{
      color:var(--muted);
      background:var(--card-soft);
      border:1px dashed var(--border);
      border-radius:14px;
      padding:.9rem;
      text-align:center;
    }

    .small-muted{color:var(--muted);font-size:.86rem}

    @media (max-width:560px){
      .summary-main{grid-template-columns:1fr 1fr}
      .summary-grid{grid-template-columns:repeat(3,1fr)}
      .summary-box strong{font-size:1.28rem}
      .metric b{font-size:.9rem}
      .worker-top{grid-template-columns:1fr 84px 40px}
      .worker-top{grid-template-columns:1fr 84px 40px}
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>מחשבון חלוקת טיפים</h1>

    <section class="sticky-summary" id="stickySummary">
      <div class="summary-main">
        <div class="summary-box">
          <span>ש״ש ממוצע</span>
          <strong id="kAvgHr">₪0.00</strong>
        </div>
        <div class="summary-box secondary">
          <span>נטו מלצרים</span>
          <strong id="kWaitersNet">₪0.00</strong>
        </div>
      </div>
      <div class="summary-grid">
        <div class="metric"><span>סה״כ</span><b id="kTotal">₪0.00</b></div>
        <div class="metric"><span>בר</span><b id="kBar">₪0.00</b></div>
        <div class="metric"><span>מסעדה</span><b id="kRest">₪0.00</b></div>
      </div>
    </section>

    <section class="card" id="settingsCard">
      <div class="grid">
        <div>
          <label for="totalTip">סה״כ טיפים</label>
          <input type="number" id="totalTip" min="0" step="0.01" inputmode="decimal" placeholder="2450">
        </div>
      </div>

      <div class="toggle-row">
        <label class="toggle-label" for="enableBarCut">
          <input id="enableBarCut" type="checkbox" checked onchange="toggleWeekendState(); updatePreview();">
          הפרשה לבר
        </label>

        <label id="weekendWrapper" class="toggle-label" for="isWeekend">
          <input type="checkbox" id="isWeekend" onchange="updatePreview();">
          סופ״ש
        </label>
      </div>
    </section>

    <section class="card" id="barSection">
      <div class="section-head">
        <h3>ברמנים</h3>
        <button type="button" onclick="toggleSection('barBody', this)">סגור</button>
      </div>
      <div class="section-body" id="barBody">
        <div id="barContainer"></div>
        <div class="actions">
          <button class="btn btn-outline" type="button" onclick="addWorker('bar'); updatePreview();">הוסף ברמן</button>
        </div>
      </div>
    </section>

    <section class="card" id="waiterSection">
      <div class="section-head">
        <h3>מלצרים</h3>
        <button type="button" onclick="toggleSection('waiterBody', this)">סגור</button>
      </div>
      <div class="section-body" id="waiterBody">
        <div id="waiterContainer"></div>
        <div class="actions">
          <button class="btn btn-outline" type="button" onclick="addWorker('waiter'); updatePreview();">הוסף מלצר</button>
        </div>
      </div>
    </section>
  </div>

  <div class="fab">
    <button class="btn" type="button" onclick="calculateTips()">חשב חלוקה</button>
  </div>

  <section class="bottom-sheet" id="resultsSheet" aria-live="polite">
    <div class="sheet-head">
      <strong>תוצאות חלוקה</strong>
      <button class="sheet-close" type="button" onclick="closeResults()" aria-label="סגור תוצאות">×</button>
    </div>

    <div class="sheet-metrics">
      <div class="metric"><span>ש״ש ממוצע</span><b id="sheetAvgHr">₪0.00</b></div>
      <div class="metric"><span>נטו מלצרים</span><b id="sheetWaitersNet">₪0.00</b></div>
      <div class="metric"><span>לבר</span><b id="sheetBar">₪0.00</b></div>
      <div class="metric"><span>למסעדה</span><b id="sheetRest">₪0.00</b></div>
    </div>

    <h3>מלצרים</h3>
    <div id="waitersTableWrap" class="empty-state">אין נתונים.</div>

    <h3 style="margin-top:1rem">ברמנים</h3>
    <div id="barTableWrap" class="empty-state">אין נתונים.</div>
  </section>

<script>
let barIdx = 0;
let waiterIdx = 0;
let lastResult = null;

const BAR_WEEK_PCT = 12;
const BAR_WEEKEND_PCT = 15;
const OUTLIER_TOLERANCE = 0.10;

const fmt = n =>
  new Intl.NumberFormat('he-IL', {
    style:'currency',
    currency:'ILS',
    maximumFractionDigits:2
  }).format(Number.isFinite(n) ? n : 0);

window.addEventListener('DOMContentLoaded', () => {
  addWorker('bar');
  addWorker('waiter');
  toggleWeekendState();
  bindPreviewEvents();
  updatePreview();
});

function bindPreviewEvents(){
  document.body.addEventListener('input', event => {
    const target = event.target;
    if(target.matches('input[type="number"], input[type="text"], input[type="radio"]')){
      updatePreview();
    }
  });

  document.body.addEventListener('change', event => {
    const target = event.target;
    if(target.matches('input[type="checkbox"], input[type="radio"]')){
      updatePreview();
    }
  });
}

function toggleWeekendState(){
  const enabled = document.getElementById('enableBarCut').checked;
  const weekend = document.getElementById('isWeekend');
  const wrapper = document.getElementById('weekendWrapper');

  if(!enabled){
    weekend.checked = false;
    weekend.disabled = true;
    wrapper.classList.add('disabled-option');
  }else{
    weekend.disabled = false;
    wrapper.classList.remove('disabled-option');
  }
}

function toggleSection(id, button){
  const body = document.getElementById(id);
  body.hidden = !body.hidden;
  button.textContent = body.hidden ? 'פתח' : 'סגור';
}

function addWorker(type, data={}){
  const container = document.getElementById(type+'Container');
  const id = type === 'bar' ? barIdx++ : waiterIdx++;

  const div = document.createElement('div');
  div.className = 'worker-card';

  const hasStars = Boolean(data.stars);
  const stars = Number(data.stars || 6);

  div.innerHTML = `
    <div class="worker-top">
      <div>
        <label for="${type}Name${id}">שם</label>
        <input type="text" id="${type}Name${id}" placeholder="שם" value="${escapeAttr(data.name || '')}">
      </div>

      <div>
        <label for="${type}Hours${id}">שעות</label>
        <input type="number" id="${type}Hours${id}" min="0" max="24" step="0.01" inputmode="decimal" placeholder="0" value="${data.hours ?? ''}">
      </div>

      <button class="remove" type="button" title="מחק עובד" aria-label="מחק עובד" onclick="removeWorker(this)">×</button>
    </div>

    <div class="worker-options">
      <label class="toggle-label" for="${type}HasStars${id}">
        <input
          type="checkbox"
          id="${type}HasStars${id}"
          ${hasStars ? 'checked' : ''}
          onchange="toggleStars('${type}',${id}); updatePreview();"
        >
        כוכבים?
      </label>
    </div>

    <div class="stars-row" id="${type}StarsOptions${id}" style="display:${hasStars ? 'flex' : 'none'}">
      <label class="toggle-label"><input type="radio" name="${type}Stars${id}" value="3" ${stars === 3 ? 'checked' : ''}>3</label>
      <label class="toggle-label"><input type="radio" name="${type}Stars${id}" value="4" ${stars === 4 ? 'checked' : ''}>4</label>
      <label class="toggle-label"><input type="radio" name="${type}Stars${id}" value="5" ${stars === 5 ? 'checked' : ''}>5</label>
      <label class="toggle-label"><input type="radio" name="${type}Stars${id}" value="6" ${!hasStars || stars === 6 ? 'checked' : ''}>6</label>
    </div>
  `;

  container.appendChild(div);
}

function toggleStars(type,id){
  const box = document.getElementById(`${type}StarsOptions${id}`);
  const checkbox = document.getElementById(`${type}HasStars${id}`);
  box.style.display = checkbox.checked ? 'flex' : 'none';
}

function removeWorker(button){
  button.closest('.worker-card').remove();
  updatePreview();
}

function getWorkers(type){
  const container = document.getElementById(type+'Container');
  const cards = container.querySelectorAll('.worker-card');
  const out = [];

  cards.forEach((card, index) => {
    const name = card.querySelector(`input[id^='${type}Name']`)?.value?.trim() || `עובד ${index+1}`;

    let hours = parseFloat(card.querySelector(`input[id^='${type}Hours']`)?.value || 0) || 0;
    hours = Math.min(Math.max(hours,0),24);

    let stars = 6;
    const hasStars = card.querySelector(`input[id^='${type}HasStars']`)?.checked;

    if(hasStars){
      const selected = card.querySelector(`input[name^='${type}Stars']:checked`);
      if(selected) stars = parseInt(selected.value,10);
    }

    if(hours > 0){
      out.push({name,hours,stars});
    }
  });

  return out;
}

function getBarPct(){
  const enableBarCut = document.getElementById('enableBarCut').checked;
  if(!enableBarCut) return 0;
  return document.getElementById('isWeekend').checked ? BAR_WEEKEND_PCT : BAR_WEEK_PCT;
}

function getProjection(){
  const totalTip = Math.max(0, parseFloat(document.getElementById('totalTip').value || 0) || 0);
  const barPct = getBarPct();
  const waiters = getWorkers('waiter');
  const barWorkers = getWorkers('bar');
  const totalWaiterHours = waiters.reduce((sum,w)=>sum+w.hours,0);
  const barTip = totalTip * (barPct/100);
  const remainingAfterBar = totalTip - barTip;

  let restPct = 0.15;
  if(totalWaiterHours > 0){
    const avgWith = p => (remainingAfterBar * (1-p)) / totalWaiterHours;
    if(avgWith(0.20) >= 100) restPct = 0.20;
    else if(avgWith(0.17) >= 90) restPct = 0.17;
  }

  const restCut = remainingAfterBar * restPct;
  const finalForWaiters = Math.max(0, remainingAfterBar - restCut);
  const avgHourly = totalWaiterHours > 0 ? finalForWaiters / totalWaiterHours : 0;

  return {totalTip,barPct,barTip,restPct,restCut,finalForWaiters,avgHourly,waiters,barWorkers,totalWaiterHours};
}

function updatePreview(){
  const p = getProjection();
  renderKpis(p);
}

function calculateTips(){
  const p = getProjection();

  if(p.totalTip <= 0 || (p.waiters.length === 0 && p.barWorkers.length === 0)){
    lastResult = null;
    renderKpis({...p,barTip:0,restCut:0,finalForWaiters:0,avgHourly:0});
    renderTables([],[],0);
    openResults();
    return;
  }

  const waiterEff = p.waiters.reduce((sum,w)=>sum + w.hours*w.stars,0);
  const waiterUnit = waiterEff ? p.finalForWaiters / waiterEff : 0;

  const waiterRows = p.waiters.map(w => {
    const pay = roundCurrency(w.hours * w.stars * waiterUnit);
    return {
      name:w.name,
      hours:w.hours,
      stars:w.stars,
      pay,
      rate:w.hours ? pay / w.hours : 0
    };
  }).sort((a,b)=>b.pay-a.pay);

  const barEff = p.barWorkers.reduce((sum,w)=>sum + w.hours*w.stars,0);
  const barUnit = barEff ? p.barTip / barEff : 0;

  const barRows = p.barWorkers.map(w => {
    const pay = roundCurrency(w.hours * w.stars * barUnit);
    return {
      name:w.name,
      hours:w.hours,
      stars:w.stars,
      pay,
      rate:w.hours ? pay / w.hours : 0
    };
  }).sort((a,b)=>b.pay-a.pay);

  lastResult = {projection:p, waiterRows, barRows};

  renderKpis(p);
  renderSheetKpis(p);
  renderTables(waiterRows, barRows, p.avgHourly);
  openResults();
  collapseAfterCalculation();
}

function collapseAfterCalculation(){
  const barBody = document.getElementById('barBody');
  const barButton = document.querySelector('button[onclick="toggleSection(\'barBody\', this)"]');
  if(barBody && barButton){
    barBody.hidden = true;
    barButton.textContent = 'פתח';
  }
}

function renderKpis(p){
  document.getElementById('kTotal').textContent = fmt(p.totalTip || 0);
  document.getElementById('kBar').textContent = `${fmt(p.barTip || 0)} (${(p.barPct || 0).toFixed(0)}%)`;
  document.getElementById('kRest').textContent = `${fmt(p.restCut || 0)} (${((p.restPct || 0)*100).toFixed(0)}%)`;
  document.getElementById('kWaitersNet').textContent = fmt(p.finalForWaiters || 0);
  document.getElementById('kAvgHr').textContent = fmt(p.avgHourly || 0);
}

function renderSheetKpis(p){
  document.getElementById('sheetAvgHr').textContent = fmt(p.avgHourly || 0);
  document.getElementById('sheetWaitersNet').textContent = fmt(p.finalForWaiters || 0);
  document.getElementById('sheetBar').textContent = `${fmt(p.barTip || 0)} (${(p.barPct || 0).toFixed(0)}%)`;
  document.getElementById('sheetRest').textContent = `${fmt(p.restCut || 0)} (${((p.restPct || 0)*100).toFixed(0)}%)`;
}

function renderTables(waiterRows, barRows, avgHourly){
  const waitersWrap = document.getElementById('waitersTableWrap');
  const barWrap = document.getElementById('barTableWrap');

  if(waiterRows.length){
    waitersWrap.className = 'table-wrap';
    waitersWrap.innerHTML = buildTable(waiterRows, avgHourly, true);
  }else{
    waitersWrap.className = 'empty-state';
    waitersWrap.textContent = 'אין מלצרים.';
  }

  if(barRows.length){
    barWrap.className = 'table-wrap';
    barWrap.innerHTML = buildTable(barRows, 0, false);
  }else{
    barWrap.className = 'empty-state';
    barWrap.textContent = 'אין ברמנים.';
  }
}

function buildTable(rows, avgHourly, markOutliers){
  const body = rows.map(row => {
    let cls = '';
    if(markOutliers && avgHourly > 0){
      if(row.rate >= avgHourly * (1 + OUTLIER_TOLERANCE)) cls = 'row-good';
      else if(row.rate <= avgHourly * (1 - OUTLIER_TOLERANCE)) cls = 'row-bad';
    }

    return `
      <tr class="${cls}">
        <td><strong>${escapeHTML(row.name)}</strong></td>
        <td>${formatNumber(row.hours)}</td>
        <td>${row.stars}</td>
        <td>${fmt(row.rate)}</td>
        <td>${fmt(row.pay)}</td>
      </tr>
    `;
  }).join('');

  return `
    <table class="table">
      <thead>
        <tr>
          <th>שם</th>
          <th>שעות</th>
          <th>כוכבים</th>
          <th>ש״ש</th>
          <th>סכום</th>
        </tr>
      </thead>
      <tbody>${body}</tbody>
    </table>
  `;
}

function openResults(){
  document.getElementById('resultsSheet').classList.add('open');
  document.getElementById('stickySummary').scrollIntoView({block:'start'});
}

function closeResults(){
  document.getElementById('resultsSheet').classList.remove('open');
}

function roundCurrency(value){
  return Math.round((value + Number.EPSILON) * 100) / 100;
}

function formatNumber(value){
  return Number(value).toLocaleString('he-IL', {maximumFractionDigits:2});
}

function escapeHTML(s){
  return (s || '').replace(/[&<>"']/g, m => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m]));
}

function escapeAttr(s){
  return escapeHTML(s);
}
</script>
