<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>מחשבון טיפים</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
      padding-bottom: 100px; /* כדי שהכפתור הצף לא יסתיר */
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .worker {
      margin-bottom: 15px;
      padding: 10px;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    /* קלטים */
    input[type="text"], input[type="number"], select {
      background-color: #fff;
      color: #000;
      border: 1px solid #ccc;
      padding: 8px;
      border-radius: 4px;
      margin: 5px;
      font-size: 16px; /* ✅ מונע זום במובייל */
    }

    /* כפתורים */
    button {
      margin: 5px;
      padding: 8px 14px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 16px; /* ✅ מונע זום גם על כפתורים */
    }

    .remove-btn {
      background-color: #e74c3c;
      color: white;
    }

    #calculateBtn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background-color: #3498db;
      color: white;
    }

    #results {
      margin-top: 20px;
      padding: 15px;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h2>מחשבון טיפים</h2>
  <div id="workers"></div>
  <button onclick="addWorker()">➕ הוסף עובד</button>
  <button id="calculateBtn" onclick="calculateTips()">חשב</button>
  <div id="results"></div>

  <script>
    function addWorker() {
      const container = document.getElementById("workers");
      const div = document.createElement("div");
      div.className = "worker";

      div.innerHTML = `
        <input type="text" placeholder="שם עובד">
        <input type="number" placeholder="שעות">
        <select>
          <option value="6" selected>⭐⭐⭐⭐⭐⭐ (6 כוכבים)</option>
          <option value="5">⭐⭐⭐⭐⭐ (5 כוכבים)</option>
          <option value="4">⭐⭐⭐⭐ (4 כוכבים)</option>
          <option value="3">⭐⭐⭐ (3 כוכבים)</option>
        </select>
        <button class="remove-btn" onclick="this.parentElement.remove()">מחק</button>
      `;

      container.appendChild(div);
    }

    function calculateTips() {
      const workers = document.querySelectorAll(".worker");
      let totalHours = 0;
      let totalStars = 0;
      let data = [];

      workers.forEach(w => {
        const name = w.querySelector("input[type=text]").value || "ללא שם";
        const hours = parseFloat(w.querySelector("input[type=number]").value) || 0;
        const stars = parseInt(w.querySelector("select").value);

        totalHours += hours;
        totalStars += stars;
        data.push({ name, hours, stars });
      });

      if (totalHours === 0) {
        alert("יש להזין שעות עבודה");
        return;
      }

      // מחשבים ערך לשעה
      const hourlyRate = 100; // דוגמה בלבד
      let deduction = 0;
      if (hourlyRate > 100) {
        deduction = 0.20;
      } else if (hourlyRate >= 90) {
        deduction = 0.17;
      } else {
        deduction = 0.15;
      }

      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "<h3>תוצאות:</h3>";
      data.forEach(d => {
        resultsDiv.innerHTML += `<p>${d.name} - ${d.hours} שעות, ${d.stars} כוכבים</p>`;
      });

      resultsDiv.innerHTML += `<p><b>סה"כ שעות:</b> ${totalHours}</p>`;
      resultsDiv.innerHTML += `<p><b>ניכוי:</b> ${(deduction * 100)}%</p>`;
    }
  </script>
</body>
</html>
