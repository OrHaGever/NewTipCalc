```html
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>מחשבון חלוקת טיפים</title>

  <style>
    :root{
      --bg:#f6f7f9;
      --fg:#1f2328;
      --card:#ffffff;
      --muted:#6a737d;
      --accent:#0d6efd;
      --ok:#198754;
      --warn:#fd7e14;
      --err:#dc3545;
      --border:#d0d7de;
      --input-bg:#ffffff;
      --input-fg:#111827;
      --focus:rgba(13,110,253,.25);
      --gap:.9rem;
      --touch:52px;
      --radius:12px;
    }

    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0b0f14;
        --fg:#e5e7eb;
        --card:#0f141b;
        --muted:#9aa3af;
        --border:#1f2937;
        --input-bg:#1b2430;
        --input-fg:#e5e7eb;
        --focus:rgba(13,110,253,.35);
      }
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        calc(100px + env(safe-area-inset-bottom))
        env(safe-area-inset-left);
      background:var(--bg);
      color:var(--fg);
      font:400 16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      max-width:820px;
      margin-inline:auto;
      scroll-padding-bottom:120px;
    }

    h1{
      margin:1rem 0 .5rem;
      text-align:center;
      font-size:1.35rem;
    }

    h3{
      margin:.2rem 0 .6rem;
    }

    .container{
      padding:var(--gap);
    }

    .group{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:var(--gap);
      margin-bottom:.8rem;
    }

    .row{
      display:flex;
      gap:.6rem;
      align-items:center;
      flex-wrap:wrap;
    }

    .row > *{
      flex:1;
    }

    label{
      display:block;
      margin:.25rem 0 .2rem;
      font-size:.95rem;
    }

    input,
    select,
    button{
      font-size:16px;
    }

    input[type="number"],
    input[type="text"],
    select{

      border:1px solid var(--border);
      border-radius:10px;
      padding:.6rem .75rem;
      background:var(--input-bg);
      color:var(--input-fg);
      caret-color:var(--input-fg);
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus{

    .row-good{

      border-right:4px solid var(--warn);

    .row-bad{

      display:flex;

      user-select:none;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>מחשבון חלוקת טיפים</h1>

  <div class="group">

    <div class="grid">

      <div>
        <label for="totalTip">סה"כ טיפים (₪)</label>
        <input
          type="number"
          id="totalTip"
          min="0"
          step="0.01"
          inputmode="decimal"
          placeholder="2450"
        />
      </div>

      <div>
        <label for="barPctWeek">% בר חול</label>
        <input
          type="number"
          id="barPctWeek"
          min="0"
          max="100"
          step="0.1"
          inputmode="decimal"
          value="12"
        >
      </div>

      <div>
        <label for="barPctWeekend">% בר סופ"ש</label>
        <input
          type="number"
          id="barPctWeekend"
          min="0"
          max="100"
          step="0.1"
          inputmode="decimal"
          value="15"
        >
      </div>

      <div>
        <label for="roundStep">עיגול תשלום</label>
        <select id="roundStep">
          <option value="0">ללא עיגול</option>
          <option value="0.5">0.5 ₪</option>
          <option value="1">1 ₪</option>
        </select>
      </div>

    </div>

    <div class="toggle-row">

      <label class="toggle-label" for="enableBarCut">
        <input
          id="enableBarCut"
          type="checkbox"
          checked
          onchange="toggleWeekendState()"
        >
        <span class="pill">הפרשה לבר</span>
      </label>

      <label id="weekendWrapper" class="toggle-label" for="isWeekend">
        <input type="checkbox" id="isWeekend">
        <span class="pill">סופ"ש</span>
      </label>

    </div>

    <div class="muted" style="margin-top:.5rem">
      * אחוז מסעדה נקבע לפי ש"ש ממוצע למלצרים לאחר ההפרשה:
      ≥100 ⇒ 20%,
      ≥90 ⇒ 17%,
      אחרת ⇒ 15%.
    </div>

  </div>

  <div class="group">
    <h3>ברמנים</h3>
    <div id="barContainer"></div>

    <div class="actions">
      <button class="btn btn-outline" onclick="addWorker('bar')">
        ➕ הוסף ברמן
      </button>
    </div>
  </div>

  <div class="group">
    <h3>מלצרים</h3>
    <div id="waiterContainer"></div>

    <div class="actions">
      <button class="btn btn-outline" onclick="addWorker('waiter')">
        ➕ הוסף מלצר
      </button>
    </div>
  </div>

  <div class="group" id="summary">

    <div class="grid">

      <div>
        סה"כ טיפ:
        <b id="kTotal">₪0.00</b>
      </div>

      <div>
        לבר:
        <b id="kBar">₪0.00</b>
        <span class="muted" id="kBarPct">(0%)</span>
      </div>

      <div>
        למסעדה:
        <b id="kRest">₪0.00</b>
        <span class="muted" id="kRestPct">(0%)</span>
      </div>

      <div>
        נטו מלצרים:
        <b id="kWaitersNet">₪0.00</b>
      </div>

      <div>
        ש"ש ממוצע:
        <b id="kAvgHr">₪0.00</b>
      </div>

    </div>

    <div class="hr"></div>

    <div><b>מלצרים</b></div>
    <div id="waitersTableWrap" class="muted">אין נתונים.</div>

    <div class="hr"></div>

    <div><b>ברמנים</b></div>
    <div id="barTableWrap" class="muted">אין נתונים.</div>

  </div>

  <div class="bottom-spacer"></div>

</div>

<div class="fab">
  <button class="btn" onclick="calculateTips()">
    חשב חלוקה
  </button>
</div>

<script>
let barIdx = 0;
let waiterIdx = 0;

const fmt = n =>
  new Intl.NumberFormat(
    'he-IL',
    {
      style:'currency',
      currency:'ILS',
      maximumFractionDigits:2
    }
  ).format(n || 0);

window.addEventListener('DOMContentLoaded', ()=>{
  addWorker('bar');
  addWorker('waiter');
  toggleWeekendState();
});

function toggleWeekendState(){
  const enabled = document.getElementById('enableBarCut').checked;
  const weekend = document.getElementById('isWeekend');
  const wrapper = document.getElementById('weekendWrapper');

  if(!enabled){
    weekend.checked = false;
    weekend.disabled = true;
    wrapper.classList.add('disabled-option');
  }else{
    weekend.disabled = false;
    wrapper.classList.remove('disabled-option');
  }
}

function addWorker(type,data={}){
  const container = document.getElementById(type+'Container');
  const id = type === 'bar' ? barIdx++ : waiterIdx++;

  const div = document.createElement('div');
  div.className = 'group';

  div.innerHTML = `
    <div class="row">

      <input
        type="text"
        placeholder="שם"
        id="${type}Name${id}"
        value="${escapeAttr(data.name || '')}"
      />

      <input
        type="number"
        placeholder="שעות"
        id="${type}Hours${id}"
        min="0"
        max="24"
        step="0.01"
        inputmode="decimal"
        value="${data.hours ?? ''}"
      />

    </div>

    <div class="row" style="align-items:center;justify-content:space-between">

      <div>

        <label class="toggle-label" for="${type}HasStars${id}">
          <input
            type="checkbox"
            id="${type}HasStars${id}"
            ${data.stars ? 'checked' : ''}
            onchange="toggleStars('${type}',${id})"
          />
          כוכבים/דרגה
        </label>

        <div
          class="row"
          id="${type}StarsOptions${id}"
          style="display:${data.stars ? 'flex' : 'none'};gap:.8rem"
        >

          <label class="toggle-label">
            <input
              type="radio"
              name="${type}Stars${id}"
              value="3"
              ${data.stars === 3 ? 'checked' : ''}
            >
            3⭐
          </label>

          <label class="toggle-label">
            <input
              type="radio"
              name="${type}Stars${id}"
              value="4"
              ${data.stars === 4 ? 'checked' : ''}
            >
            4⭐
          </label>

          <label class="toggle-label">
            <input
              type="radio"
              name="${type}Stars${id}"
              value="5"
              ${data.stars === 5 ? 'checked' : ''}
            >
            5⭐
          </label>

          <label class="toggle-label">
            <input
              type="radio"
              name="${type}Stars${id}"
              value="6"
              ${!data.stars || data.stars === 6 ? 'checked' : ''}
            >
            6⭐
          </label>

        </div>

        <div class="muted" style="margin-top:.2rem">
          אם לא מסומן — נספר כ־6⭐.
        </div>

      </div>

      <div class="actions" style="flex:0">
        <button
          class="remove"
          title="מחק עובד"
          aria-label="מחק עובד"
          onclick="this.closest('.group').remove()"
        >
          🗑️
        </button>
      </div>

    </div>
  `;

  container.appendChild(div);
}

function toggleStars(type,id){
  const box = document.getElementById(`${type}StarsOptions${id}`);
  const visible = getComputedStyle(box).display !== 'none';

  box.style.display = visible ? 'none' : 'flex';
}

function getWorkers(type){
  const container = document.getElementById(type+'Container');
  const groups = container.querySelectorAll('.group');
  const out = [];

  groups.forEach((g,i)=>{
    const name =
      g.querySelector(`input[id^='${type}Name']`)
      ?.value
      ?.trim()
      || `עובד ${i+1}`;

    let hours =
      parseFloat(
        g.querySelector(`input[id^='${type}Hours']`)
        ?.value || 0
      );

    hours = Math.min(Math.max(hours,0),24);

    let stars = 6;

    const hasStars =
      g.querySelector(`input[id^='${type}HasStars']`)
      ?.checked;

    if(hasStars){
      const sel = g.querySelector(`input[name^='${type}Stars']:checked`);
      if(sel){
        stars = parseInt(sel.value,10);
      }
    }

    if(hours > 0){
      out.push({
        name,
        hours,
        stars,
        node:g
      });
    }
  });

  return out;
}

function roundToStep(value,step){
  if(!step || step <= 0){
    return Math.round((value + Number.EPSILON) * 100) / 100;
  }

  const k = Math.round(value / step) * step;
  return Math.round((k + Number.EPSILON) * 100) / 100;
}

function calculateTips(){
  const totalTip =
    Math.max(
      0,
      parseFloat(document.getElementById('totalTip').value || 0)
    );

  const isWeekend = document.getElementById('isWeekend').checked;
  const enableBarCut = document.getElementById('enableBarCut').checked;

  const barPct = enableBarCut
    ? Math.max(
        0,
        Math.min(
          100,
          parseFloat(
            (
              isWeekend
                ? document.getElementById('barPctWeekend').value
                : document.getElementById('barPctWeek').value
            ) || 0
          )
        )
      )
    : 0;

  const roundStep =
    parseFloat(document.getElementById('roundStep').value || 0);

  const barWorkers = getWorkers('bar');
  const waiters = getWorkers('waiter');

  const totalWaiterHours =
    waiters.reduce((s,w)=> s + w.hours,0);

  if(
    totalTip <= 0 ||
    (
      waiters.length === 0 &&
      barWorkers.length === 0
    )
  ){
    renderSummary(
      {
        totalTip,
        barTip:0,
        barPct,
        restCut:0,
        restPct:0,
        finalForWaiters:0
      },
      [],
      []
    );
    return;
  }

  const barTip = totalTip * (barPct / 100);
  const remainingAfterBar = totalTip - barTip;

  let restPercent = 0.15;

  if(totalWaiterHours > 0){
    const avgWith = p =>
      (remainingAfterBar * (1-p)) / totalWaiterHours;

    if(avgWith(0.20) >= 100){
      restPercent = 0.20;
    }else if(avgWith(0.17) >= 90){
      restPercent = 0.17;
    }else{
      restPercent = 0.15;
    }
  }

  const restaurantCut = remainingAfterBar * restPercent;
  const finalForWaiters = Math.max(0, remainingAfterBar - restaurantCut);

  const effWaiters =
    waiters.reduce((s,w)=> s + (w.hours * w.stars),0);

  const perEffHour =
    effWaiters ? finalForWaiters / effWaiters : 0;

  const waitersAlloc =
    waiters.map(w =>
      roundToStep(
        w.hours * w.stars * perEffHour,
        roundStep
      )
    );

  const effBar =
    barWorkers.reduce((s,w)=> s + (w.hours * w.stars),0);

  const perBarUnit =
    effBar ? barTip / effBar : 0;

  const barAlloc =
    barWorkers.map(w =>
      roundToStep(
        w.hours * w.stars * perBarUnit,
        roundStep
      )
    );

  const avgHourly =
    totalWaiterHours > 0
      ? finalForWaiters / totalWaiterHours
      : 0;

  const waiterRows =
    waiters.map((w,i)=>({
      name:w.name,
      hours:w.hours,
      stars:w.stars,
      pay:waitersAlloc[i],
      rate:w.hours ? waitersAlloc[i] / w.hours : 0
    }));

  const barRows =
    barWorkers.map((w,i)=>({
      name:w.name,
      hours:w.hours,
      stars:w.stars,
      pay:barAlloc[i],
      rate:w.hours ? barAlloc[i] / w.hours : 0
    }));

  waiterRows.sort((a,b)=> b.pay-a.pay);
  barRows.sort((a,b)=> b.pay-a.pay);

  renderSummary(
    {
      totalTip,
      barTip,
      barPct,
      restCut:restaurantCut,
      restPct:restPercent,
      finalForWaiters
    },
    waiterRows,
    barRows,
    avgHourly
  );
}

function renderSummary(k, waiterRows, barRows, avgHourly=0){
  document.getElementById('kTotal').innerText =
    fmt(k.totalTip || 0);

  document.getElementById('kBar').innerText =
    fmt(k.barTip || 0);

  document.getElementById('kBarPct').innerText =
    `(${(k.barPct || 0).toFixed(1)}%)`;

  document.getElementById('kRest').innerText =
    fmt(k.restCut || 0);

  document.getElementById('kRestPct').innerText =
    `(${((k.restPct || 0)*100).toFixed(0)}%)`;

  document.getElementById('kWaitersNet').innerText =
    fmt(k.finalForWaiters || 0);

  document.getElementById('kAvgHr').innerText =
    fmt(avgHourly || 0);

  if(waiterRows.length){
    const body =
      waiterRows.map(r=>{
        const cls =
          avgHourly > 0
            ? (
              r.rate >= avgHourly*1.05
                ? 'row-good'
                : (
                  r.rate <= avgHourly*0.95
                    ? 'row-bad'
                    : 'row-warn'
                )
            )
            : '';

        return `
          <tr class="${cls}">
            <td>${escapeHTML(r.name)}</td>
            <td>${r.hours}</td>
            <td>${r.stars}</td>
            <td>${fmt(r.rate)}</td>
            <td>${fmt(r.pay)}</td>
          </tr>
        `;
      }).join('');

    document.getElementById('waitersTableWrap').innerHTML = `
      <table class="table">
        <tr>
          <th>שם</th>
          <th>שעות</th>
          <th>⭐</th>
          <th>ש"ש</th>
          <th>סכום</th>
        </tr>
        ${body}
      </table>
    `;
  }else{
    document.getElementById('waitersTableWrap').innerHTML =
      `<div class="muted">אין מלצרים.</div>`;
  }

  if(barRows.length){
    const body =
      barRows.map(r=>`
        <tr>
          <td>${escapeHTML(r.name)}</td>
          <td>${r.hours}</td>
          <td>${r.stars}</td>
          <td>${fmt(r.rate)}</td>
          <td>${fmt(r.pay)}</td>
        </tr>
      `).join('');

    document.getElementById('barTableWrap').innerHTML = `
      <table class="table">
        <tr>
          <th>שם</th>
          <th>שעות</th>
          <th>⭐</th>
          <th>ש"ש</th>
          <th>סכום</th>
        </tr>
        ${body}
      </table>
    `;
  }else{
    document.getElementById('barTableWrap').innerHTML =
      `<div class="muted">אין ברמנים.</div>`;
  }
}

function escapeHTML(s){
  return (s || '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );
}

function escapeAttr(s){
  return (s || '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );
}
</script>

</body>
</html>
