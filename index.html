<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>מחשבון חלוקת טיפים - מהיר ומותאם מובייל</title>
  <meta name="theme-color" content="#0d6efd"/>

  <!-- Alef font -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ====== Design tokens ====== */
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#0f172a;        /* text-slate-900 */
      --muted:#64748b;       /* slate-500 */
      --primary:#0d6efd;
      --danger:#dc3545;
      --warn:#fd7e14;
      --ok:#198754;
      --border:#e2e8f0;      /* slate-200 */
      --shadow:0 6px 18px rgba(15,23,42,.06);
      --radius:14px;
      --gap:.9rem;
      --touch:54px;          /* min touch target height */
      --fab-h:68px;          /* height of the floating button */
      --focus:#94c0ff;       /* visible focus ring */
      --accent:#0d6efd;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0b0f14;
        --card:#0e141c;
        --text:#e5e7eb;
        --muted:#9aa3af;
        --border:#1f2937;
        --shadow:none;
        --focus:#2b5da8;
      }
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(140px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
      background:var(--bg);
      color:var(--text);
      font:400 16px/1.5 "Alef", system-ui,-apple-system,Segoe UI,Roboto,Arial,Helvetica,sans-serif;
      -webkit-font-smoothing:antialiased;
      max-width:720px;
      margin-inline:auto;
      text-rendering:optimizeLegibility;
    }
    h1{font-size:1.4rem;margin:1rem 0 .6rem;text-align:center}
    h3{font-size:1.05rem;margin:.2rem 0 .6rem;text-align:center;color:var(--text)}

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:calc(var(--gap) + .1rem);
      margin:.65rem 0;
    }
    .row{display:flex; gap:.6rem; align-items:center; flex-wrap:wrap}
    .row > *{flex:1}
    label{display:block; font-size:.95rem; margin:.25rem 0}

    input[type="number"], input[type="text"], select{
      width:100%; height:var(--touch);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.65rem .8rem;
      background:#ffffff !important;
      color:#0f172a !important;
      caret-color:#0f172a;
      outline:none;
      transition:border-color .15s ease, box-shadow .15s ease, transform .02s ease;
      accent-color:var(--accent);
    }
    input[type="number"]:focus, input[type="text"]:focus, select:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px var(--focus);
    }
    ::placeholder{color:#8fa0b3}

    input[type="checkbox"], input[type="radio"]{
      inline-size:1.15rem; block-size:1.15rem;
      accent-color:var(--accent);
    }

    .btn{
      height:var(--touch);
      border:none; border-radius:999px;
      background:var(--primary); color:#fff; font-weight:700;
      letter-spacing:.2px; cursor:pointer;
      padding:0 1.05rem;
      box-shadow:0 6px 14px rgba(13,110,253,.22);
      transition:transform .05s ease, box-shadow .15s ease, opacity .15s ease;
      will-change:transform;
    }
    .btn:hover{opacity:.95}
    .btn:active{transform:translateY(1px)}
    .btn:focus-visible{outline:none; box-shadow:0 0 0 3px var(--focus), 0 6px 14px rgba(13,110,253,.22)}
    .btn-outline{
      background:transparent; color:var(--primary);
      border:1px solid var(--primary);
      box-shadow:none;
    }
    .btn-danger{background:var(--danger)}
    .btn-small{height:44px; font-size:.95rem}
    .btn-ghost{background:transparent; color:var(--danger); border:1px solid var(--danger)}

    .actions{display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.4rem}
    .actions .btn{margin:.15rem 0}

    .tag{display:inline-block; padding:.2rem .55rem; border:1px solid var(--border); border-radius:999px; color:var(--muted); font-size:.85rem; background:#fff}

    .group{
      border:1px dashed var(--border);
      border-radius:12px; padding:.65rem; margin:.55rem 0;
      background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.65));
    }

    .row-good{background:linear-gradient(0deg, rgba(25,135,84,.09), rgba(25,135,84,.09)); border-inline-start:4px solid var(--ok)}
    .row-warn{background:linear-gradient(0deg, rgba(253,126,20,.1), rgba(253,126,20,.1)); border-inline-start:4px solid var(--warn)}
    .row-bad {background:linear-gradient(0deg, rgba(220,53,69,.11), rgba(220,53,69,.11)); border-inline-start:4px solid var(--danger)}

    .person{
      display:grid;
      grid-template-columns:1.3fr .7fr .8fr .8fr auto;
      gap:.55rem; align-items:center;
      padding:.5рем .65rem; border:1px solid var(--border); border-radius:12px;
      background:#fff;
    }
    .person .actions-inline{
      display:flex; gap:.4rem; align-items:center; justify-content:flex-end;
    }
    .person .actions-inline .btn{height:40px; padding:0 .8rem}

    @media (max-width:560px){
      .person{ grid-template-columns:1fr 1fr; }
      .person > :nth-child(1){grid-column:1 / -1}     /* שם */
      .person > :nth-child(2){grid-column:1 / 2}      /* שעות */
      .person > :nth-child(3){grid-column:2 / 3}      /* כוכבים (צ'קבוקס) */
      .person .meta{
        grid-column:1 / -1;
        display:flex; gap:.5rem; flex-wrap:wrap; color:var(--muted); font-size:.9rem
      }
      .person .actions-inline{grid-column:1 / -1; justify-content:flex-start}
    }

    .summary{
      display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:.65rem
    }
    .kpi{
      border:1px solid var(--border); border-radius:12px; padding:.7rem;
      background:#fff;
    }
    .kpi b{display:block; font-size:1.06rem}
    .kpi .sub{display:block; font-size:.9rem; color:var(--muted); margin-top:.2rem}

    .fab{
      position:fixed;
      right:18px; bottom:18px; left:18px;
      z-index:9;
      padding-bottom:env(safe-area-inset-bottom);
    }
    .fab .btn{width:100%; min-height:var(--fab-h)}

    .muted{color:var(--muted)}
    .sep{height:1px; background:var(--border); margin:.85rem 0}
    .bottom-spacer{height:calc(var(--fab-h) + 48px)}

    /* נגישות/אנימציות */
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important; transition:none!important}
    }
  </style>
</head>
<body>
  <h1>מחשבון חלוקת טיפים</h1>

  <!-- קלטים כלליים -->
  <div class="card">
    <div class="row">
      <div>
        <label for="totalTip">סה"כ טיפים (₪)</label>
        <input id="totalTip" type="number" step="0.01" inputmode="decimal" placeholder="לדוגמה: 2450">
      </div>
      <div>
        <label class="muted" style="margin-bottom:.35rem;">סופ"ש?</label>
        <div class="row" style="align-items:center">
          <input id="isWeekend" type="checkbox">
          <span class="tag">משפיע על % בר (12/15)</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ברמנים -->
  <div class="card">
    <h3>ברמנים</h3>
    <div id="barContainer"></div>
    <div class="actions">
      <button class="btn btn-outline btn-small" onclick="addWorker('bar')">➕ הוסף ברמן</button>
    </div>
  </div>

  <!-- מלצרים -->
  <div class="card">
    <h3>מלצרים</h3>
    <div id="waiterContainer"></div>
    <div class="actions">
      <button class="btn btn-outline btn-small" onclick="addWorker('waiter')">➕ הוסף מלצר</button>
    </div>
  </div>

  <!-- סיכום -->
  <div class="card">
    <div class="summary" id="summaryKpis">
      <div class="kpi"><span class="muted">סה"כ טיפ</span><b id="kpiTotal">₪0.00</b></div>
      <div class="kpi"><span class="muted">לבר</span><b id="kpiBarAmount">₪0.00</b><span class="sub" id="kpiBarPct">0%</span></div>
      <div class="kpi"><span class="muted">למסעדה</span><b id="kpiRestAmount">₪0.00</b><span class="sub" id="kpiRestPct">0%</span></div>
      <div class="kpi"><span class="muted">נטו מלצרים</span><b id="kpiWaiters">₪0.00</b></div>
      <div class="kpi"><span class="muted">ש"ש ממוצע (לאחר)</span><b id="kpiAvgHr">₪0.00</b></div>
    </div>
    <div class="sep"></div>
    <div id="results"></div>
  </div>

  <!-- ספייסר נוסף כדי להבטיח גלילה מעבר לכפתור -->
  <div class="bottom-spacer" aria-hidden="true"></div>

  <!-- כפתור חשב צף -->
  <div class="fab"><button class="btn" onclick="calculateTips()">חשב חלוקה</button></div>

<script>
  const money = n => new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:2}).format(+n||0);
  let barCount=0, waiterCount=0;

  window.addEventListener('DOMContentLoaded', ()=>{
    addWorker('bar'); addWorker('waiter');
  });

  function addWorker(type){
    const container = document.getElementById(type+'Container');
    const id = (type==='bar' ? barCount++ : waiterCount++);
    const wrap = document.createElement('div');
    wrap.className='group';
    wrap.innerHTML = `
      <div class="person">
        <input type="text" placeholder="שם" id="${type}Name${id}" />
        <input type="number" step="0.01" inputmode="decimal" placeholder="שעות" id="${type}Hours${id}" />

        <!-- כפתור כוכבים -->
        <label><input type="checkbox" id="${type}HasStars${id}" onchange="toggleStars('${type}',${id})"/> כוכבים</label>

        <div class="meta">ברירת מחדל: 6⭐ אם לא נבחר</div>

        <!-- פעולות -->
        <div class="actions-inline">
          <button class="btn btn-ghost" onclick="this.closest('.group').remove()">🗑️ מחק</button>
        </div>
      </div>

      <!-- אפשרויות כוכבים -->
      <div class="row" id="${type}StarsOptions${id}" style="display:none; margin-top:.5rem">
        <label><input type="radio" name="${type}Stars${id}" value="3"> 3⭐</label>
        <label><input type="radio" name="${type}Stars${id}" value="4"> 4⭐</label>
        <label><input type="radio" name="${type}Stars${id}" value="5"> 5⭐</label>
        <label><input type="radio" name="${type}Stars${id}" value="6" checked> 6⭐</label>
      </div>
    `;
    container.appendChild(wrap);
  }

  function toggleStars(type,id){
    const el = document.getElementById(`${type}StarsOptions${id}`);
    el.style.display = (el.style.display==='none' || !el.style.display) ? 'flex' : 'none';
  }

  function getWorkers(type){
    const container = document.getElementById(type+'Container');
    const groups = container.querySelectorAll('.group');
    const out=[];
    groups.forEach((g,i)=>{
      const name = g.querySelector(`input[id^='${type}Name']`)?.value?.trim() || `עובד ${i+1}`;
      const hours = parseFloat(g.querySelector(`input[id^='${type}Hours']`)?.value)||0;
      let stars = 6;
      const hasStars = g.querySelector(`input[id^='${type}HasStars']`)?.checked;
      if(hasStars){
        const sel = g.querySelector(`input[name^='${type}Stars']:checked`);
        if(sel) stars = parseInt(sel.value,10);
      }
      if(hours>0) out.push({name,hours,stars, node:g});
    });
    return out;
  }

  function calculateTips(){
    const totalTip = Math.max(0, parseFloat(document.getElementById('totalTip').value)||0);
    const isWeekend = document.getElementById('isWeekend').checked;
    const barPct = isWeekend ? 0.15 : 0.12;

    const barWorkers = getWorkers('bar');
    const waiters = getWorkers('waiter');

    const totalWaiterHours = waiters.reduce((s,w)=>s+w.hours,0);
    if(totalTip<=0 || totalWaiterHours<=0){
      renderKpis({totalTip, barTip:0, barPct, restCut:0, restPct:0, finalWaiters:0, avgHourly:0});
      document.getElementById('results').innerHTML = `<div class="muted">נא להזין טיפ חיובי ולפ至少 מלצר אחד עם שעות &gt; 0.</div>`;
      return;
    }

    const barTip = totalTip * barPct;
    const remainingAfterBar = totalTip - barTip;

    // אחוז מסעדה לפי שכר שעתי ממוצע לאחר ההפרשה
    const avgHourlyWith = p => (remainingAfterBar * (1-p)) / totalWaiterHours;
    let restPct;
    if(avgHourlyWith(0.20) >= 100){ restPct = 0.20; }
    else if(avgHourlyWith(0.17) >= 90){ restPct = 0.17; }
    else { restPct = 0.15; }

    const restCut = remainingAfterBar * restPct;
    const finalForWaiters = remainingAfterBar - restCut;

    // חלוקה למלצרים לפי שעות*כוכבים
    const eff = waiters.reduce((s,w)=> s + w.hours*w.stars, 0);
    const perEff = eff ? finalForWaiters/eff : 0;
    const waiterPays = waiters.map(w=> ({...w, pay: w.hours*w.stars*perEff, rate: (w.hours? (w.hours*w.stars*perEff)/w.hours : 0)}));

    // חלוקת בר (שעות*כוכבים)
    const effBar = barWorkers.reduce((s,w)=> s + w.hours*w.stars, 0);
    const perBar = effBar ? barTip/effBar : 0;
    const barPays = barWorkers.map(w=> ({...w, pay: w.hours*w.stars*perBar, rate: (w.hours? (w.hours*w.stars*perBar)/w.hours : 0)}));

    const avgHourly = finalForWaiters / totalWaiterHours;
    renderKpis({totalTip, barTip, barPct, restCut, restPct, finalWaiters:finalForWaiters, avgHourly});

    const tol = 0.05; // 5%
    const res = [];
    if(waiterPays.length){
      res.push(`<div class="muted" style="margin:.4rem 0">מלצרים</div>`);
      waiterPays.forEach(w=>{
        const cls = classifyRow(w.rate, avgHourly, tol);
        res.push(rowHTML(w.name, w.hours, w.stars, w.rate, w.pay, cls));
        w.node.classList.remove('row-good','row-warn','row-bad');
        if(cls) w.node.classList.add(cls);
      });
    }
    if(barPays.length){
      res.push(`<div class="muted" style="margin:.6rem 0 .2rem">ברמנים</div>`);
      barPays.forEach(w=>{
        res.push(rowHTML(w.name, w.hours, w.stars, w.rate, w.pay, ''));
      });
    }
    document.getElementById('results').innerHTML = res.join('');
  }

  function classifyRow(rate, avg, tol=0.05){
    if(avg<=0) return '';
    if(rate >= avg*(1+tol)) return 'row-good';
    if(rate <= avg*(1-tol)) return 'row-bad';
    return 'row-warn';
  }

  function rowHTML(name,hours,stars,rate,pay,cls){
    return `
      <div class="person ${cls||''}">
        <div><b>${escapeHTML(name)}</b></div>
        <div>שעות: ${hours}</div>
        <div>⭐ ${stars}</div>
        <div>ש"ש: ${money(rate)}</div>
        <div>סכום: ${money(pay)}</div>
      </div>
    `;
  }

  // גרסת KPI מעודכנת (עם שמירה לאחור אם לא קיימים IDs ישנים)
  function renderKpis({totalTip, barTip, barPct, restCut, restPct, finalWaiters, avgHourly}){
    const set = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
    set('kpiTotal', money(totalTip));

    // תצוגה חדשה (amount + אחוז בשורה נפרדת)
    set('kpiBarAmount', money(barTip));
    set('kpiBarPct', `${(barPct*100).toFixed(0)}%`);
    set('kpiRestAmount', money(restCut));
    set('kpiRestPct', `${(restPct*100).toFixed(0)}%`);

    // תאימות לאחור אם מישהו עדיין משתמש ב-IDs הישנים
    const legacyBar = document.getElementById('kpiBar');
    if(legacyBar) legacyBar.textContent = `${money(barTip)} (${(barPct*100).toFixed(0)}%)`;
    const legacyRest = document.getElementById('kpiRest');
    if(legacyRest) legacyRest.textContent = `${money(restCut)} (${(restPct*100).toFixed(0)}%)`;

    set('kpiWaiters', money(finalWaiters));
    set('kpiAvgHr', money(avgHourly));
  }

  function escapeHTML(s){return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script>
</body>
</html>
