
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>מחשבון חלוקת טיפים</title>

  <style>
    :root{
      --bg:#f4f6f8;
      --fg:#1f2328;
      --card:#ffffff;
      --card-soft:#f8fafc;
      --muted:#6a737d;
      --accent:#0d6efd;
      --accent-soft:rgba(13,110,253,.10);
      --ok:#198754;
      --warn:#fd7e14;
      --err:#dc3545;
      --border:#d0d7de;
      --input-bg:#ffffff;
      --input-fg:#111827;
      --focus:rgba(13,110,253,.25);
      --shadow:0 1px 5px rgba(15,23,42,.06);
      --gap:.9rem;
      --touch:52px;
      --radius:16px;
    }

    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0b0f14;
        --fg:#e5e7eb;
        --card:#0f141b;
        --card-soft:#111827;
        --muted:#9aa3af;
        --border:#1f2937;
        --input-bg:#1b2430;
        --input-fg:#e5e7eb;
        --focus:rgba(13,110,253,.35);
        --shadow:none;
      }
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        calc(104px + env(safe-area-inset-bottom))
        env(safe-area-inset-left);
      background:var(--bg);
      color:var(--fg);
      font:400 16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      max-width:820px;
      margin-inline:auto;
      scroll-padding-bottom:120px;
    }

    h1{
      margin:1rem 0 .8rem;
      text-align:center;
      font-size:1.45rem;
      font-weight:800;
    }

    h3{
      margin:.1rem 0 .7rem;
      font-size:1.05rem;
    }

    .container{
      padding:var(--gap);
    }

    .group{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:var(--gap);
      margin-bottom:.85rem;
      box-shadow:var(--shadow);
    }

    .section-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:.6rem;
      margin-bottom:.6rem;
    }

    .row{
      display:flex;
      gap:.6rem;
      align-items:center;
      flex-wrap:wrap;
    }

    .row > *{
      flex:1;
    }

    label{
      display:block;
      margin:.25rem 0 .25rem;
      font-size:.95rem;
    }

    input,
    button{
      font-size:16px;
    }

    input[type="number"],
    input[type="text"]{
      width:100%;
      height:var(--touch);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.65rem .8rem;
      background:var(--input-bg);
      color:var(--input-fg);
      caret-color:var(--input-fg);
    }

    input[type="text"]:focus,
    input[type="number"]:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 3px var(--focus);
    }

    ::placeholder{
      color:var(--muted);
    }

    input[type="checkbox"],
    input[type="radio"]{
      inline-size:1.2rem;
      block-size:1.2rem;
      cursor:pointer;
      accent-color:var(--accent);
    }

    .btn{
      height:var(--touch);
      border:none;
      border-radius:999px;
      background:var(--accent);
      color:#fff;
      font-weight:700;
      cursor:pointer;
      padding:0 1rem;
    }

    .btn-outline{
      background:var(--card);
      color:var(--accent);
      border:1px solid var(--accent);
    }

    .remove{
      width:40px;
      min-width:40px;
      height:40px;
      padding:0;
      background:transparent;
      color:var(--err);
      border:1px solid var(--err);
      border-radius:999px;
      cursor:pointer;
    }

    .actions{
      display:flex;
      gap:.5rem;
      flex-wrap:wrap;
      margin-top:.5rem;
    }

    .pill{
      display:inline-block;
      padding:.2rem .65rem;
      border:1px solid var(--border);
      border-radius:999px;
      font-size:.9rem;
      color:var(--muted);
      background:var(--card-soft);
    }

    .hr{
      border:none;
      border-top:1px solid var(--border);
      margin:.9rem 0;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:.65rem;
    }

    .worker-card{
      background:var(--card-soft);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.7rem;
      margin-bottom:.65rem;
    }

    .worker-main{
      display:grid;
      grid-template-columns:1.2fr .8fr 40px;
      gap:.5rem;
      align-items:center;
    }

    .stars-line{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:.6rem;
      margin-top:.6rem;
      flex-wrap:wrap;
    }

    .stars-options{
      display:none;
      gap:.65rem;
      flex-wrap:wrap;
      align-items:center;
      margin-top:.55rem;
      padding:.55rem;
      border:1px solid var(--border);
      border-radius:12px;
      background:var(--card);
    }

    .toggle-row{
      display:flex;
      gap:.7rem;
      flex-wrap:wrap;
      align-items:center;
      margin-top:.75rem;
    }

    .toggle-label{
      display:flex;
      align-items:center;
      gap:.5rem;
      user-select:none;
      cursor:pointer;
    }

    .disabled-option{
      opacity:.45;
      pointer-events:none;
    }

    .kpi-card{
      background:var(--card-soft);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.75rem;
      min-height:70px;
    }

    .kpi-card span{
      display:block;
      color:var(--muted);
      font-size:.88rem;
      margin-bottom:.2rem;
    }

    .kpi-card b{
      display:block;
      font-size:1.05rem;
    }

    .row-good{
      background:linear-gradient(0deg, rgba(25,135,84,.08), rgba(25,135,84,.08));
      border-right:4px solid var(--ok);
    }

    .row-warn{
      background:linear-gradient(0deg, rgba(253,126,20,.09), rgba(253,126,20,.09));
      border-right:4px solid var(--warn);
    }

    .row-bad{
      background:linear-gradient(0deg, rgba(220,53,69,.09), rgba(220,53,69,.09));
      border-right:4px solid var(--err);
    }

    .table-wrap{
      overflow-x:auto;
      border:1px solid var(--border);
      border-radius:14px;
      background:var(--card);
      margin-top:.55rem;
    }

    .table{
      width:100%;
      border-collapse:collapse;
      min-width:520px;
    }

    .table th,
    .table td{
      border-bottom:1px solid var(--border);
      padding:.55rem;
      text-align:start;
      white-space:nowrap;
    }

    .table tr:last-child td{
      border-bottom:none;
    }

    .table th{
      color:var(--muted);
      font-weight:700;
      background:var(--card-soft);
    }

    .fab{
      position:fixed;
      left:18px;
      right:18px;
      bottom:18px;
      z-index:9;
    }

    .fab .btn{
      width:100%;
      min-height:58px;
      box-shadow:0 10px 30px rgba(13,110,253,.22);
    }

    .bottom-spacer{
      height:100px;
    }

    .muted{
      color:var(--muted);
    }

    @media(max-width:480px){
      .worker-main{
        grid-template-columns:1fr .75fr 40px;
      }

      .grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>מחשבון חלוקת טיפים</h1>

  <div class="group">
    <div>
      <label for="totalTip">סה"כ טיפים (₪)</label>
      <input
        type="number"
        id="totalTip"
        min="0"
        step="0.01"
        inputmode="decimal"
        placeholder="2450"
      />
    </div>

    <div class="toggle-row">
      <label class="toggle-label" for="enableBarCut">
        <input
          id="enableBarCut"
          type="checkbox"
          checked
          onchange="toggleWeekendState()"
        >
        <span class="pill">הפרשה לבר</span>
      </label>

      <label id="weekendWrapper" class="toggle-label" for="isWeekend">
        <input type="checkbox" id="isWeekend">
        <span class="pill">סופ"ש</span>
      </label>
    </div>
  </div>

  <div class="group">
    <div class="section-title">
      <h3>ברמנים</h3>
    </div>

    <div id="barContainer"></div>

    <div class="actions">
      <button class="btn btn-outline" onclick="addWorker('bar')">
        ➕ הוסף ברמן
      </button>
    </div>
  </div>

  <div class="group">
    <div class="section-title">
      <h3>מלצרים</h3>
    </div>

    <div id="waiterContainer"></div>

    <div class="actions">
      <button class="btn btn-outline" onclick="addWorker('waiter')">
        ➕ הוסף מלצר
      </button>
    </div>
  </div>

  <div class="group" id="summary">
    <div class="grid">
      <div class="kpi-card">
        <span>סה"כ טיפ</span>
        <b id="kTotal">₪0.00</b>
      </div>

      <div class="kpi-card">
        <span>לבר</span>
        <b>
          <span id="kBar" style="display:inline">₪0.00</span>
          <small class="muted" id="kBarPct">(0%)</small>
        </b>
      </div>

      <div class="kpi-card">
        <span>למסעדה</span>
        <b>
          <span id="kRest" style="display:inline">₪0.00</span>
          <small class="muted" id="kRestPct">(0%)</small>
        </b>
      </div>

      <div class="kpi-card">
        <span>נטו מלצרים</span>
        <b id="kWaitersNet">₪0.00</b>
      </div>

      <div class="kpi-card">
        <span>ש"ש ממוצע</span>
        <b id="kAvgHr">₪0.00</b>
      </div>
    </div>

    <div class="hr"></div>

    <div><b>מלצרים</b></div>
    <div id="waitersTableWrap" class="muted">אין נתונים.</div>

    <div class="hr"></div>

    <div><b>ברמנים</b></div>
    <div id="barTableWrap" class="muted">אין נתונים.</div>
  </div>

  <div class="bottom-spacer"></div>

</div>

<div class="fab">
  <button class="btn" onclick="calculateTips()">
    חשב חלוקה
  </button>
</div>

<script>
let barIdx = 0;
let waiterIdx = 0;

const BAR_PCT_WEEK = 12;
const BAR_PCT_WEEKEND = 15;

const fmt = n =>
  new Intl.NumberFormat(
    'he-IL',
    {
      style:'currency',
      currency:'ILS',
      maximumFractionDigits:2
    }
  ).format(n || 0);

window.addEventListener('DOMContentLoaded', ()=>{
  addWorker('bar');
  addWorker('waiter');
  toggleWeekendState();
});

function toggleWeekendState(){
  const enabled = document.getElementById('enableBarCut').checked;
  const weekend = document.getElementById('isWeekend');
  const wrapper = document.getElementById('weekendWrapper');

  if(!enabled){
    weekend.checked = false;
    weekend.disabled = true;
    wrapper.classList.add('disabled-option');
  }else{
    weekend.disabled = false;
    wrapper.classList.remove('disabled-option');
  }
}

function addWorker(type,data={}){
  const container = document.getElementById(type+'Container');
  const id = type === 'bar' ? barIdx++ : waiterIdx++;

  const div = document.createElement('div');
  div.className = 'worker-card';

  div.innerHTML = `
    <div class="worker-main">
      <input
        type="text"
        placeholder="שם"
        id="${type}Name${id}"
        value="${escapeAttr(data.name || '')}"
      />

      <input
        type="number"
        placeholder="שעות"
        id="${type}Hours${id}"
        min="0"
        max="24"
        step="0.01"
        inputmode="decimal"
        value="${data.hours ?? ''}"
      />

      <button
        class="remove"
        title="מחק עובד"
        aria-label="מחק עובד"
        onclick="this.closest('.worker-card').remove()"
      >
        🗑️
      </button>
    </div>

    <div class="stars-line">
      <label class="toggle-label" for="${type}HasStars${id}">
        <input
          type="checkbox"
          id="${type}HasStars${id}"
          ${data.stars ? 'checked' : ''}
          onchange="toggleStars('${type}',${id})"
        />
        כוכבים?
      </label>
    </div>

    <div
      class="stars-options"
      id="${type}StarsOptions${id}"
      style="display:${data.stars ? 'flex' : 'none'}"
    >
      <label class="toggle-label">
        <input
          type="radio"
          name="${type}Stars${id}"
          value="3"
          ${data.stars === 3 ? 'checked' : ''}
        >
        3⭐
      </label>

      <label class="toggle-label">
        <input
          type="radio"
          name="${type}Stars${id}"
          value="4"
          ${data.stars === 4 ? 'checked' : ''}
        >
        4⭐
      </label>

      <label class="toggle-label">
        <input
          type="radio"
          name="${type}Stars${id}"
          value="5"
          ${data.stars === 5 ? 'checked' : ''}
        >
        5⭐
      </label>

      <label class="toggle-label">
        <input
          type="radio"
          name="${type}Stars${id}"
          value="6"
          ${!data.stars || data.stars === 6 ? 'checked' : ''}
        >
        6⭐
      </label>
    </div>
  `;

  container.appendChild(div);
}

function toggleStars(type,id){
  const box = document.getElementById(`${type}StarsOptions${id}`);
  const visible = getComputedStyle(box).display !== 'none';

  box.style.display = visible ? 'none' : 'flex';
}

function getWorkers(type){
  const container = document.getElementById(type+'Container');
  const cards = container.querySelectorAll('.worker-card');
  const out = [];

  cards.forEach((card,i)=>{
    const name =
      card.querySelector(`input[id^='${type}Name']`)
      ?.value
      ?.trim()
      || `עובד ${i+1}`;

    let hours =
      parseFloat(
        card.querySelector(`input[id^='${type}Hours']`)
        ?.value || 0
      );

    hours = Math.min(Math.max(hours,0),24);

    let stars = 6;

    const hasStars =
      card.querySelector(`input[id^='${type}HasStars']`)
      ?.checked;

    if(hasStars){
      const sel = card.querySelector(`input[name^='${type}Stars']:checked`);
      if(sel){
        stars = parseInt(sel.value,10);
      }
    }

    if(hours > 0){
      out.push({
        name,
        hours,
        stars
      });
    }
  });

  return out;
}

function roundMoney(value){
  return Math.round((value + Number.EPSILON) * 100) / 100;
}

function calculateTips(){
  const totalTip =
    Math.max(
      0,
      parseFloat(document.getElementById('totalTip').value || 0)
    );

  const isWeekend = document.getElementById('isWeekend').checked;
  const enableBarCut = document.getElementById('enableBarCut').checked;

  const barPct = enableBarCut
    ? (isWeekend ? BAR_PCT_WEEKEND : BAR_PCT_WEEK)
    : 0;

  const barWorkers = getWorkers('bar');
  const waiters = getWorkers('waiter');

  const totalWaiterHours =
    waiters.reduce((s,w)=> s + w.hours,0);

  if(
    totalTip <= 0 ||
    (
      waiters.length === 0 &&
      barWorkers.length === 0
    )
  ){
    renderSummary(
      {
        totalTip,
        barTip:0,
        barPct,
        restCut:0,
        restPct:0,
        finalForWaiters:0
      },
      [],
      []
    );
    return;
  }

  const barTip = totalTip * (barPct / 100);
  const remainingAfterBar = totalTip - barTip;

  let restPercent = 0.15;

  if(totalWaiterHours > 0){
    const avgWith = p =>
      (remainingAfterBar * (1-p)) / totalWaiterHours;

    if(avgWith(0.20) >= 100){
      restPercent = 0.20;
    }else if(avgWith(0.17) >= 90){
      restPercent = 0.17;
    }else{
      restPercent = 0.15;
    }
  }

  const restaurantCut = remainingAfterBar * restPercent;
  const finalForWaiters = Math.max(0, remainingAfterBar - restaurantCut);

  const effWaiters =
    waiters.reduce((s,w)=> s + (w.hours * w.stars),0);

  const perEffHour =
    effWaiters ? finalForWaiters / effWaiters : 0;

  const waitersAlloc =
    waiters.map(w =>
      roundMoney(w.hours * w.stars * perEffHour)
    );

  const effBar =
    barWorkers.reduce((s,w)=> s + (w.hours * w.stars),0);

  const perBarUnit =
    effBar ? barTip / effBar : 0;

  const barAlloc =
    barWorkers.map(w =>
      roundMoney(w.hours * w.stars * perBarUnit)
    );

  const avgHourly =
    totalWaiterHours > 0
      ? finalForWaiters / totalWaiterHours
      : 0;

  const waiterRows =
    waiters.map((w,i)=>({
      name:w.name,
      hours:w.hours,
      stars:w.stars,
      pay:waitersAlloc[i],
      rate:w.hours ? waitersAlloc[i] / w.hours : 0
    }));

  const barRows =
    barWorkers.map((w,i)=>({
      name:w.name,
      hours:w.hours,
      stars:w.stars,
      pay:barAlloc[i],
      rate:w.hours ? barAlloc[i] / w.hours : 0
    }));

  waiterRows.sort((a,b)=> b.pay-a.pay);
  barRows.sort((a,b)=> b.pay-a.pay);

  renderSummary(
    {
      totalTip,
      barTip,
      barPct,
      restCut:restaurantCut,
      restPct:restPercent,
      finalForWaiters
    },
    waiterRows,
    barRows,
    avgHourly
  );
}

function renderSummary(k, waiterRows, barRows, avgHourly=0){
  document.getElementById('kTotal').innerText =
    fmt(k.totalTip || 0);

  document.getElementById('kBar').innerText =
    fmt(k.barTip || 0);

  document.getElementById('kBarPct').innerText =
    `(${(k.barPct || 0).toFixed(0)}%)`;

  document.getElementById('kRest').innerText =
    fmt(k.restCut || 0);

  document.getElementById('kRestPct').innerText =
    `(${((k.restPct || 0)*100).toFixed(0)}%)`;

  document.getElementById('kWaitersNet').innerText =
    fmt(k.finalForWaiters || 0);

  document.getElementById('kAvgHr').innerText =
    fmt(avgHourly || 0);

  if(waiterRows.length){
    const body =
      waiterRows.map(r=>{
        const cls =
          avgHourly > 0
            ? (
              r.rate >= avgHourly*1.05
                ? 'row-good'
                : (
                  r.rate <= avgHourly*0.95
                    ? 'row-bad'
                    : 'row-warn'
                )
            )
            : '';

        return `
          <tr class="${cls}">
            <td>${escapeHTML(r.name)}</td>
            <td>${r.hours}</td>
            <td>${r.stars}</td>
            <td>${fmt(r.rate)}</td>
            <td>${fmt(r.pay)}</td>
          </tr>
        `;
      }).join('');

    document.getElementById('waitersTableWrap').innerHTML = `
      <div class="table-wrap">
        <table class="table">
          <tr>
            <th>שם</th>
            <th>שעות</th>
            <th>⭐</th>
            <th>ש"ש</th>
            <th>סכום</th>
          </tr>
          ${body}
        </table>
      </div>
    `;
  }else{
    document.getElementById('waitersTableWrap').innerHTML =
      `<div class="muted">אין מלצרים.</div>`;
  }

  if(barRows.length){
    const body =
      barRows.map(r=>`
        <tr>
          <td>${escapeHTML(r.name)}</td>
          <td>${r.hours}</td>
          <td>${r.stars}</td>
          <td>${fmt(r.rate)}</td>
          <td>${fmt(r.pay)}</td>
        </tr>
      `).join('');

    document.getElementById('barTableWrap').innerHTML = `
      <div class="table-wrap">
        <table class="table">
          <tr>
            <th>שם</th>
            <th>שעות</th>
            <th>⭐</th>
            <th>ש"ש</th>
            <th>סכום</th>
          </tr>
          ${body}
        </table>
      </div>
    `;
  }else{
    document.getElementById('barTableWrap').innerHTML =
      `<div class="muted">אין ברמנים.</div>`;
  }
}

function escapeHTML(s){
  return (s || '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );
}

function escapeAttr(s){
  return (s || '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );
}
</script>

</body>
</html>
