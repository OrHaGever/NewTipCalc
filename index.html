<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>מחשבון חלוקת טיפים</title>

  <style>
    :root{
      --bg:#f4f6f8;
      --fg:#1f2328;
      --card:#ffffff;
      --card-soft:#f8fafc;
      --muted:#68707b;
      --accent:#0d6efd;
      --accent-soft:rgba(13,110,253,.10);
      --ok:#198754;
      --err:#dc3545;
      --border:#d0d7de;
      --input-bg:#ffffff;
      --input-fg:#111827;
      --focus:rgba(13,110,253,.25);
      --shadow:0 1px 5px rgba(15,23,42,.06);
      --radius:16px;
      --touch:52px;
      --gap:.9rem;
    }

    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0b0f14;
        --fg:#e5e7eb;
        --card:#0f141b;
        --card-soft:#111827;
        --muted:#9aa3af;
        --border:#1f2937;
        --input-bg:#1b2430;
        --input-fg:#e5e7eb;
        --focus:rgba(13,110,253,.35);
        --shadow:none;
      }
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth; overflow-x:hidden}

    body{
      margin:0;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        calc(96px + env(safe-area-inset-bottom))
        env(safe-area-inset-left);
      background:var(--bg);
      color:var(--fg);
      font:400 16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      max-width:820px;
      margin-inline:auto;
      scroll-padding-top:112px;
      scroll-padding-bottom:120px;
      overflow-x:hidden;
    }

    .container{padding:var(--gap); max-width:100%; overflow-x:hidden}

    h1{
      margin:1rem 0 .8rem;
      text-align:center;
      font-size:1.45rem;
      font-weight:800;
    }

    h3{margin:0;font-size:1.05rem}

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:var(--gap);
      margin-bottom:.85rem;
      box-shadow:var(--shadow);
      max-width:100%;
      overflow:hidden;
    }

    .sticky-summary{
      position:sticky;
      top:env(safe-area-inset-top);
      z-index:8;
      background:color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:.65rem;
      margin-bottom:.85rem;
      box-shadow:var(--shadow);
      max-width:100%;
      overflow:hidden;
    }

    .summary-main{
      display:grid;
      grid-template-columns:1.25fr 1fr;
      gap:.55rem;
      align-items:stretch;
    }

    .summary-box{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.7rem;
      min-width:0;
    }

    .summary-box span,
    .metric span{
      display:block;
      color:var(--muted);
      font-size:.78rem;
      margin-bottom:.18rem;
    }

    .summary-box strong{
      display:block;
      font-size:clamp(1.1rem, 5vw, 1.42rem);
      line-height:1.1;
      letter-spacing:-.02em;
      overflow-wrap:anywhere;
    }

    .summary-box.secondary strong{font-size:clamp(.95rem, 4vw, 1.05rem)}

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:.45rem;
      margin-top:.5rem;
    }

    .metric{
      background:var(--card-soft);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.55rem;
      min-width:0;
    }

    .metric b{
      display:block;
      font-size:.95rem;
      overflow-wrap:anywhere;
      line-height:1.25;
    }

    .row{
      display:flex;
      gap:.6rem;
      align-items:center;
      flex-wrap:wrap;
      max-width:100%;
    }

    .row > *{flex:1; min-width:0}

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
      gap:.65rem;
      max-width:100%;
    }

    label{display:block;margin:.25rem 0 .25rem;font-size:.95rem}
    input,button{font-size:16px}

    input[type="number"],
    input[type="text"]{
      width:100%;
      height:var(--touch);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.65rem .8rem;
      background:var(--input-bg);
      color:var(--input-fg);
      caret-color:var(--input-fg);
      min-width:0;
    }

    input[type="text"]:focus,
    input[type="number"]:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 3px var(--focus);
    }

    ::placeholder{color:var(--muted)}

    input[type="checkbox"],
    input[type="radio"]{
      inline-size:1.2rem;
      block-size:1.2rem;
      cursor:pointer;
      flex:0 0 auto;
    }

    .toggle-row{
      display:flex;
      gap:.7rem;
      flex-wrap:wrap;
      margin-top:.75rem;
    }

    .toggle-label{
      display:flex;
      align-items:center;
      gap:.5rem;
      min-height:44px;
      padding:.45rem .65rem;
      border:1px solid var(--border);
      border-radius:999px;
      background:var(--card-soft);
      user-select:none;
      cursor:pointer;
      margin:0;
      width:max-content;
      max-width:100%;
    }

    .disabled-option{opacity:.45;pointer-events:none}

    .btn{
      height:var(--touch);
      border:none;
      border-radius:999px;
      background:var(--accent);
      color:#fff;
      font-weight:700;
      cursor:pointer;
      padding:0 1rem;
    }

    .btn-outline{
      background:var(--card);
      color:var(--accent);
      border:1px solid var(--accent);
    }

    .btn-plain{
      background:transparent;
      color:var(--fg);
      border:1px solid var(--border);
    }

    .actions{
      display:flex;
      gap:.5rem;
      flex-wrap:wrap;
      margin-top:.65rem;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:.7rem;
      margin-bottom:.65rem;
    }

    .section-head button{
      height:34px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--card-soft);
      color:var(--fg);
      padding:0 .7rem;
      cursor:pointer;
      flex:0 0 auto;
    }

    .section-body[hidden]{display:none}

    .worker-card{
      background:var(--card-soft);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.7rem;
      margin-bottom:.6rem;
      max-width:100%;
      overflow:hidden;
    }

    .worker-top{
      display:grid;
      grid-template-columns:minmax(0,1fr) 84px 40px;
      gap:.5rem;
      align-items:end;
      max-width:100%;
    }

    .worker-options{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:.7rem;
      margin-top:.6rem;
      flex-wrap:wrap;
    }

    .remove{
      width:40px;
      min-width:40px;
      height:40px;
      padding:0;
      background:transparent;
      color:var(--err);
      border:1px solid var(--err);
      border-radius:999px;
      cursor:pointer;
      font-size:1.05rem;
      line-height:1;
    }

    .stars-row{
      display:flex;
      gap:.7rem;
      flex-wrap:wrap;
      margin-top:.55rem;
    }

    .stars-row .toggle-label{
      min-height:38px;
      padding:.35rem .55rem;
      background:var(--card);
    }

    .results-panel[hidden]{display:none}

    .results-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:.7rem;
      margin-bottom:.75rem;
    }

    .results-head button{
      width:40px;
      height:40px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--card-soft);
      color:var(--fg);
      cursor:pointer;
      font-weight:800;
      flex:0 0 auto;
    }

    .sheet-metrics{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:.5rem;
      margin:.75rem 0 .95rem;
    }

    .result-list{
      display:grid;
      gap:.55rem;
      margin-top:.55rem;
      max-width:100%;
    }

    .result-card{
      background:var(--card-soft);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.72rem;
      max-width:100%;
      overflow:hidden;
    }

    .result-card.high{border-right:4px solid var(--ok)}
    .result-card.low{border-right:4px solid var(--err)}

    .result-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:.6rem;
      margin-bottom:.55rem;
    }

    .result-name{
      font-weight:800;
      font-size:1rem;
      min-width:0;
      overflow-wrap:anywhere;
    }

    .result-pay{
      font-weight:900;
      font-size:1.08rem;
      white-space:nowrap;
      color:var(--fg);
    }

    .result-details{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:.45rem;
    }

    .detail-box{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.5rem;
      min-width:0;
    }

    .detail-box span{
      display:block;
      color:var(--muted);
      font-size:.76rem;
      margin-bottom:.12rem;
    }

    .detail-box b{
      display:block;
      font-size:.94rem;
      overflow-wrap:anywhere;
      line-height:1.25;
    }

    .empty-state{
      color:var(--muted);
      background:var(--card-soft);
      border:1px dashed var(--border);
      border-radius:14px;
      padding:.9rem;
      text-align:center;
      margin-top:.55rem;
    }

    .fab{
      position:fixed;
      left:18px;
      right:18px;
      bottom:18px;
      z-index:10;
      max-width:784px;
      margin:auto;
    }

    .fab .btn{width:100%;box-shadow:0 8px 28px rgba(13,110,253,.22)}

    @media (max-width:560px){
      body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
      .summary-main{grid-template-columns:1fr 1fr}
      .summary-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .metric{padding:.5rem .42rem}
      .metric b{font-size:.82rem}
      .worker-top{grid-template-columns:minmax(0,1fr) 76px 40px}
      .sheet-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
      .result-details{grid-template-columns:repeat(3,minmax(0,1fr))}
      .detail-box{padding:.45rem .38rem}
      .detail-box b{font-size:.86rem}
      .result-pay{font-size:1rem}
    }

    @media (max-width:370px){
      .summary-grid{grid-template-columns:1fr 1fr}
      .result-details{grid-template-columns:1fr 1fr}
      .detail-box:last-child{grid-column:1/-1}
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>מחשבון חלוקת טיפים</h1>

    <section class="sticky-summary" id="stickySummary">
      <div class="summary-main">
        <div class="summary-box">
          <span>ש״ש ממוצע</span>
          <strong id="kAvgHr">₪0.00</strong>
        </div>
        <div class="summary-box secondary">
          <span>נטו מלצרים</span>
          <strong id="kWaitersNet">₪0.00</strong>
        </div>
      </div>
      <div class="summary-grid">
        <div class="metric"><span>סה״כ</span><b id="kTotal">₪0.00</b></div>
        <div class="metric"><span>בר</span><b id="kBar">₪0.00</b></div>
        <div class="metric"><span>מסעדה</span><b id="kRest">₪0.00</b></div>
      </div>
    </section>

    <section class="card" id="settingsCard">
      <div class="grid">
        <div>
          <label for="totalTip">סה״כ טיפים</label>
          <input type="number" id="totalTip" min="0" step="0.01" inputmode="decimal" placeholder="2450">
        </div>
      </div>

      <div class="toggle-row">
        <label class="toggle-label" for="enableBarCut">
          <input id="enableBarCut" type="checkbox" checked onchange="toggleWeekendState(); updatePreview();">
          הפרשה לבר
        </label>

        <label id="weekendWrapper" class="toggle-label" for="isWeekend">
          <input type="checkbox" id="isWeekend" onchange="updatePreview();">
          סופ״ש
        </label>

        <button class="btn btn-plain" type="button" onclick="clearAllData()" style="height:44px;padding:0 .8rem;font-size:.9rem;flex:0 0 auto;">
          נקה הכל
        </button>
      </div>
    </section>

    <section class="card" id="waiterSection">
      <div class="section-head">
        <h3>מלצרים</h3>
        <button type="button" onclick="toggleSection('waiterBody', this)">סגור</button>
      </div>
      <div class="section-body" id="waiterBody">
        <div id="waiterContainer"></div>
        <div class="actions">
          <button class="btn btn-outline" type="button" id="addWaiterBtn">הוסף מלצר</button>
        </div>
      </div>
    </section>

    <section class="card" id="barSection">
      <div class="section-head">
        <h3>ברמנים</h3>
        <button type="button" onclick="toggleSection('barBody', this)">סגור</button>
      </div>
      <div class="section-body" id="barBody">
        <div id="barContainer"></div>
        <div class="actions">
          <button class="btn btn-outline" type="button" id="addBarBtn">הוסף ברמן</button>
        </div>
      </div>
    </section>

    <section class="card results-panel" id="resultsPanel" hidden aria-live="polite">
      <div class="results-head">
        <h3>תוצאות חלוקה</h3>
        <button type="button" onclick="closeResults()" aria-label="הסתר תוצאות">×</button>
      </div>

      <div class="sheet-metrics">
        <div class="metric"><span>סה״כ טיפ</span><b id="sheetTotal">₪0.00</b></div>
        <div class="metric"><span>הפרשה לבר</span><b id="sheetBar">₪0.00</b></div>
        <div class="metric"><span>הפרשה למסעדה</span><b id="sheetRest">₪0.00</b></div>
        <div class="metric"><span>נטו מלצרים</span><b id="sheetWaitersNet">₪0.00</b></div>
        <div class="metric"><span>ממוצע שעתי</span><b id="sheetAvgHr">₪0.00</b></div>
      </div>

      <div class="actions">
        <button class="btn btn-outline" type="button" id="shareWhatsappBtn">שלח סיכום לוואטסאפ</button>
      </div>

      <h3>מלצרים</h3>
      <div id="waitersTableWrap" class="empty-state">אין נתונים.</div>

      <h3 style="margin-top:1rem">ברמנים</h3>
      <div id="barTableWrap" class="empty-state">אין נתונים.</div>
    </section>
  </div>

  <div class="fab">
    <button class="btn" type="button" onclick="calculateTips()">חשב חלוקה</button>
  </div>

<script>
let barIdx = 0;
let waiterIdx = 0;
let lastResult = null;
let isLoadingDraft = false;

const STORAGE_KEY = 'tipsCalculatorDraftV1';
const BAR_WEEK_PCT = 12;
const BAR_WEEKEND_PCT = 15;
const OUTLIER_TOLERANCE = 0.10;

const fmt = n =>
  new Intl.NumberFormat('he-IL', {
    style:'currency',
    currency:'ILS',
    maximumFractionDigits:2
  }).format(Number.isFinite(n) ? n : 0);

window.addEventListener('DOMContentLoaded', () => {
  const loaded = loadDraft();
  if(!loaded){
    addWorker('waiter');
    addWorker('bar');
  }
  toggleWeekendState();
  bindPreviewEvents();
  bindActionButtons();
  updatePreview();
});


function bindActionButtons(){
  const addWaiterBtn = document.getElementById('addWaiterBtn');
  const addBarBtn = document.getElementById('addBarBtn');
  const shareWhatsappBtn = document.getElementById('shareWhatsappBtn');

  if(addWaiterBtn){
    addWaiterBtn.addEventListener('click', () => handleAddWorker('waiter'));
  }

  if(addBarBtn){
    addBarBtn.addEventListener('click', () => handleAddWorker('bar'));
  }

  if(shareWhatsappBtn){
    shareWhatsappBtn.addEventListener('click', shareWhatsappSummary);
  }
}

function handleAddWorker(type){
  addWorker(type);
  updatePreview();
}

function bindPreviewEvents(){
  document.body.addEventListener('input', event => {
    const target = event.target;
    if(target.matches('input[type="number"], input[type="text"], input[type="radio"]')){
      updatePreview();
      saveDraft();
    }
  });

  document.body.addEventListener('change', event => {
    const target = event.target;
    if(target.matches('input[type="checkbox"], input[type="radio"]')){
      updatePreview();
      saveDraft();
    }
  });
}

function toggleWeekendState(){
  const enabled = document.getElementById('enableBarCut').checked;
  const weekend = document.getElementById('isWeekend');
  const wrapper = document.getElementById('weekendWrapper');

  if(!enabled){
    weekend.checked = false;
    weekend.disabled = true;
    wrapper.classList.add('disabled-option');
  }else{
    weekend.disabled = false;
    wrapper.classList.remove('disabled-option');
  }
}

function toggleSection(id, button){
  const body = document.getElementById(id);
  body.hidden = !body.hidden;
  button.textContent = body.hidden ? 'פתח' : 'סגור';
}

function addWorker(type, data={}){
  const container = document.getElementById(type+'Container');
  const id = type === 'bar' ? barIdx++ : waiterIdx++;

  const div = document.createElement('div');
  div.className = 'worker-card';

  const hasStars = Boolean(data.hasStars ?? data.stars);
  const stars = Number(data.stars || 6);

  div.innerHTML = `
    <div class="worker-top">
      <div>
        <label for="${type}Name${id}">שם</label>
        <input type="text" id="${type}Name${id}" placeholder="שם" value="${escapeAttr(data.name || '')}">
      </div>

      <div>
        <label for="${type}Hours${id}">שעות</label>
        <input type="number" id="${type}Hours${id}" min="0" max="24" step="0.01" inputmode="decimal" placeholder="0" value="${data.hours ?? ''}">
      </div>

      <button class="remove" type="button" title="מחק עובד" aria-label="מחק עובד" onclick="removeWorker(this)">×</button>
    </div>

    <div class="worker-options">
      <label class="toggle-label" for="${type}HasStars${id}">
        <input
          type="checkbox"
          id="${type}HasStars${id}"
          ${hasStars ? 'checked' : ''}
          onchange="toggleStars('${type}',${id}); updatePreview();"
        >
        כוכבים?
      </label>
    </div>

    <div class="stars-row" id="${type}StarsOptions${id}" style="display:${hasStars ? 'flex' : 'none'}">
      <label class="toggle-label"><input type="radio" name="${type}Stars${id}" value="3" ${stars === 3 ? 'checked' : ''}>3</label>
      <label class="toggle-label"><input type="radio" name="${type}Stars${id}" value="4" ${stars === 4 ? 'checked' : ''}>4</label>
      <label class="toggle-label"><input type="radio" name="${type}Stars${id}" value="5" ${stars === 5 ? 'checked' : ''}>5</label>
      <label class="toggle-label"><input type="radio" name="${type}Stars${id}" value="6" ${!hasStars || stars === 6 ? 'checked' : ''}>6</label>
    </div>
  `;

  container.appendChild(div);
  saveDraft();
}

function toggleStars(type,id){
  const box = document.getElementById(`${type}StarsOptions${id}`);
  const checkbox = document.getElementById(`${type}HasStars${id}`);
  box.style.display = checkbox.checked ? 'flex' : 'none';
}

function removeWorker(button){
  button.closest('.worker-card').remove();
  updatePreview();
  saveDraft();
}

function getWorkers(type){
  const container = document.getElementById(type+'Container');
  const cards = container.querySelectorAll('.worker-card');
  const out = [];

  cards.forEach((card, index) => {
    const name = card.querySelector(`input[id^='${type}Name']`)?.value?.trim() || `עובד ${index+1}`;

    let hours = parseFloat(card.querySelector(`input[id^='${type}Hours']`)?.value || 0) || 0;
    hours = Math.min(Math.max(hours,0),24);

    let stars = 6;
    const hasStars = card.querySelector(`input[id^='${type}HasStars']`)?.checked;

    if(hasStars){
      const selected = card.querySelector(`input[name^='${type}Stars']:checked`);
      if(selected) stars = parseInt(selected.value,10);
    }

    if(hours > 0){
      out.push({name,hours,stars});
    }
  });

  return out;
}

function getBarPct(){
  const enableBarCut = document.getElementById('enableBarCut').checked;
  if(!enableBarCut) return 0;
  return document.getElementById('isWeekend').checked ? BAR_WEEKEND_PCT : BAR_WEEK_PCT;
}

function getProjection(){
  const totalTip = Math.max(0, parseFloat(document.getElementById('totalTip').value || 0) || 0);
  const barPct = getBarPct();
  const waiters = getWorkers('waiter');
  const barWorkers = getWorkers('bar');
  const totalWaiterHours = waiters.reduce((sum,w)=>sum+w.hours,0);
  const barTip = totalTip * (barPct/100);
  const remainingAfterBar = totalTip - barTip;

  let restPct = 0.15;
  if(totalWaiterHours > 0){
    const avgWith = p => (remainingAfterBar * (1-p)) / totalWaiterHours;
    if(avgWith(0.20) >= 100) restPct = 0.20;
    else if(avgWith(0.17) >= 90) restPct = 0.17;
  }

  const restCut = remainingAfterBar * restPct;
  const finalForWaiters = Math.max(0, remainingAfterBar - restCut);
  const avgHourly = totalWaiterHours > 0 ? finalForWaiters / totalWaiterHours : 0;

  return {totalTip,barPct,barTip,restPct,restCut,finalForWaiters,avgHourly,waiters,barWorkers,totalWaiterHours};
}

function updatePreview(){
  const p = getProjection();
  renderKpis(p);
  saveDraft();
}

function calculateTips(){
  const p = getProjection();

  const validationMessage = getValidationMessage(p);
  if(validationMessage){
    alert(validationMessage);
    return;
  }

  if(p.totalTip <= 0 || (p.waiters.length === 0 && p.barWorkers.length === 0)){
    lastResult = null;
    renderKpis({...p,barTip:0,restCut:0,finalForWaiters:0,avgHourly:0});
    renderSheetKpis({...p,barTip:0,restCut:0,finalForWaiters:0,avgHourly:0});
    renderResults([],[],0);
    openResults();
    return;
  }

  const waiterEff = p.waiters.reduce((sum,w)=>sum + w.hours*w.stars,0);
  const waiterUnit = waiterEff ? p.finalForWaiters / waiterEff : 0;

  const waiterRows = p.waiters.map(w => {
    const pay = roundCurrency(w.hours * w.stars * waiterUnit);
    return {
      name:w.name,
      hours:w.hours,
      stars:w.stars,
      pay,
      rate:w.hours ? pay / w.hours : 0
    };
  });

  const barEff = p.barWorkers.reduce((sum,w)=>sum + w.hours*w.stars,0);
  const barUnit = barEff ? p.barTip / barEff : 0;

  const barRows = p.barWorkers.map(w => {
    const pay = roundCurrency(w.hours * w.stars * barUnit);
    return {
      name:w.name,
      hours:w.hours,
      stars:w.stars,
      pay,
      rate:w.hours ? pay / w.hours : 0
    };
  });

  lastResult = {projection:p, waiterRows, barRows};

  renderKpis(p);
  renderSheetKpis(p);
  renderResults(waiterRows, barRows, p.avgHourly);
  openResults();
  collapseAfterCalculation();
}

function collapseAfterCalculation(){
  const barBody = document.getElementById('barBody');
  const barButton = document.querySelector('button[onclick="toggleSection(\'barBody\', this)"]');
  if(barBody && barButton){
    barBody.hidden = true;
    barButton.textContent = 'פתח';
  }
}

function renderKpis(p){
  document.getElementById('kTotal').textContent = fmt(p.totalTip || 0);
  document.getElementById('kBar').textContent = `${fmt(p.barTip || 0)} (${(p.barPct || 0).toFixed(0)}%)`;
  document.getElementById('kRest').textContent = `${fmt(p.restCut || 0)} (${((p.restPct || 0)*100).toFixed(0)}%)`;
  document.getElementById('kWaitersNet').textContent = fmt(p.finalForWaiters || 0);
  document.getElementById('kAvgHr').textContent = fmt(p.avgHourly || 0);
}

function renderSheetKpis(p){
  document.getElementById('sheetTotal').textContent = fmt(p.totalTip || 0);
  document.getElementById('sheetBar').textContent = `${fmt(p.barTip || 0)} (${(p.barPct || 0).toFixed(0)}%)`;
  document.getElementById('sheetRest').textContent = `${fmt(p.restCut || 0)} (${((p.restPct || 0)*100).toFixed(0)}%)`;
  document.getElementById('sheetWaitersNet').textContent = fmt(p.finalForWaiters || 0);
  document.getElementById('sheetAvgHr').textContent = fmt(p.avgHourly || 0);
}

function renderResults(waiterRows, barRows, avgHourly){
  const waitersWrap = document.getElementById('waitersTableWrap');
  const barWrap = document.getElementById('barTableWrap');

  if(waiterRows.length){
    waitersWrap.className = 'result-list';
    waitersWrap.innerHTML = buildResultCards(waiterRows, avgHourly, true);
  }else{
    waitersWrap.className = 'empty-state';
    waitersWrap.textContent = 'אין מלצרים.';
  }

  if(barRows.length){
    barWrap.className = 'result-list';
    barWrap.innerHTML = buildResultCards(barRows, 0, false);
  }else{
    barWrap.className = 'empty-state';
    barWrap.textContent = 'אין ברמנים.';
  }
}

function buildResultCards(rows, avgHourly, markOutliers){
  return rows.map(row => {
    let cls = '';
    if(markOutliers && avgHourly > 0){
      if(row.rate >= avgHourly * (1 + OUTLIER_TOLERANCE)) cls = 'high';
      else if(row.rate <= avgHourly * (1 - OUTLIER_TOLERANCE)) cls = 'low';
    }

    return `
      <article class="result-card ${cls}">
        <div class="result-top">
          <div class="result-name">${escapeHTML(row.name)}</div>
          <div class="result-pay">${fmt(row.pay)}</div>
        </div>
        <div class="result-details">
          <div class="detail-box"><span>שעות</span><b>${formatNumber(row.hours)}</b></div>
          <div class="detail-box"><span>כוכבים</span><b>${row.stars}</b></div>
          <div class="detail-box"><span>ש״ש</span><b>${fmt(row.rate)}</b></div>
        </div>
      </article>
    `;
  }).join('');
}

function openResults(){
  const panel = document.getElementById('resultsPanel');
  panel.hidden = false;
  requestAnimationFrame(() => panel.scrollIntoView({block:'start'}));
}

function closeResults(){
  document.getElementById('resultsPanel').hidden = true;
}

function getValidationMessage(p){
  if(p.totalTip <= 0) return 'חסר סה״כ טיפים.';
  if(p.waiters.length === 0 && p.barWorkers.length === 0) return 'לא הוזנו עובדים עם שעות.';
  if(p.waiters.length === 0) return 'לא הוזנו מלצרים עם שעות.';
  return '';
}

function collectWorkerDraft(type){
  const container = document.getElementById(type+'Container');
  return Array.from(container.querySelectorAll('.worker-card')).map(card => {
    const name = card.querySelector(`input[id^='${type}Name']`)?.value || '';
    const hours = card.querySelector(`input[id^='${type}Hours']`)?.value || '';
    const hasStars = Boolean(card.querySelector(`input[id^='${type}HasStars']`)?.checked);
    const selected = card.querySelector(`input[name^='${type}Stars']:checked`);
    const stars = selected ? Number(selected.value) : 6;
    return {name,hours,hasStars,stars};
  });
}

function saveDraft(){
  if(isLoadingDraft) return;
  try{
    const draft = {
      totalTip: document.getElementById('totalTip')?.value || '',
      enableBarCut: Boolean(document.getElementById('enableBarCut')?.checked),
      isWeekend: Boolean(document.getElementById('isWeekend')?.checked),
      waiters: collectWorkerDraft('waiter'),
      bars: collectWorkerDraft('bar')
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(draft));
  }catch(e){}
}

function loadDraft(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;

    const draft = JSON.parse(raw);
    isLoadingDraft = true;

    document.getElementById('totalTip').value = draft.totalTip || '';
    document.getElementById('enableBarCut').checked = draft.enableBarCut !== false;
    document.getElementById('isWeekend').checked = Boolean(draft.isWeekend);

    document.getElementById('waiterContainer').innerHTML = '';
    document.getElementById('barContainer').innerHTML = '';
    waiterIdx = 0;
    barIdx = 0;

    const waiters = Array.isArray(draft.waiters) && draft.waiters.length ? draft.waiters : [{}];
    const bars = Array.isArray(draft.bars) && draft.bars.length ? draft.bars : [{}];

    waiters.forEach(worker => addWorker('waiter', worker));
    bars.forEach(worker => addWorker('bar', worker));

    isLoadingDraft = false;
    return true;
  }catch(e){
    isLoadingDraft = false;
    return false;
  }
}

function clearAllData(){
  if(!confirm('לנקות את כל הנתונים שהוזנו?')) return;

  localStorage.removeItem(STORAGE_KEY);
  lastResult = null;
  waiterIdx = 0;
  barIdx = 0;

  document.getElementById('totalTip').value = '';
  document.getElementById('enableBarCut').checked = true;
  document.getElementById('isWeekend').checked = false;
  document.getElementById('waiterContainer').innerHTML = '';
  document.getElementById('barContainer').innerHTML = '';

  addWorker('waiter');
  addWorker('bar');
  toggleWeekendState();
  updatePreview();
  closeResults();
}

function buildWhatsappText(){
  if(!lastResult) return '';

  const {projection:p, waiterRows, barRows} = lastResult;
  const lines = [];

  lines.push('סיכום חלוקת טיפים');
  lines.push('');
  lines.push(`סה״כ טיפ: ${fmt(p.totalTip)}`);
  lines.push(`הפרשה לבר (${p.barPct.toFixed(0)}%): ${fmt(p.barTip)}`);
  lines.push(`הפרשה למסעדה (${(p.restPct*100).toFixed(0)}%): ${fmt(p.restCut)}`);
  lines.push(`נטו מלצרים: ${fmt(p.finalForWaiters)}`);
  lines.push(`ממוצע שעתי: ${fmt(p.avgHourly)}`);

  if(waiterRows.length){
    lines.push('');
    lines.push('מלצרים:');
    waiterRows.forEach(row => {
      lines.push(`${row.name} - ${formatNumber(row.hours)} שעות, ${row.stars} כוכבים, ${fmt(row.pay)}, ש״ש ${fmt(row.rate)}`);
    });
  }

  if(barRows.length){
    lines.push('');
    lines.push('ברמנים:');
    barRows.forEach(row => {
      lines.push(`${row.name} - ${formatNumber(row.hours)} שעות, ${fmt(row.pay)}`);
    });
  }

  return lines.join('\n');
}

function shareWhatsappSummary(){
  if(!lastResult){
    alert('קודם צריך לחשב חלוקה.');
    return;
  }

  const text = buildWhatsappText();
  if(!text){
    alert('לא נוצר טקסט לסיכום.');
    return;
  }

  const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
  const link = document.createElement('a');
  link.href = url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  document.body.appendChild(link);
  link.click();
  link.remove();
}

function roundCurrency(value){
  return Math.round((value + Number.EPSILON) * 100) / 100;
}

function formatNumber(value){
  return Number(value).toLocaleString('he-IL', {maximumFractionDigits:2});
}

function escapeHTML(s){
  return (s || '').replace(/[&<>"']/g, m => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m]));
}

function escapeAttr(s){
  return escapeHTML(s);
}
</script>
