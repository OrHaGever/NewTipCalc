<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>מחשבון חלוקת טיפים - מעודכן</title>
  <link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet"/>
  <meta name="theme-color" content="#007bff"/>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --primary-color: #007bff;
      --danger-color: #dc3545;
      --text-color: #212529;
      --border-radius: 6px;
      --box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      --gap: 0.75rem;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: var(--gap);
      background: var(--bg-color);
      color: var(--text-color);
      font-family: 'Alef', sans-serif;
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin: var(--gap) 0;
      font-size: 1.75rem;
      font-weight: 700;
    }
    h3 {
      text-align: center;
      margin: var(--gap) 0;
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    label { display: block; font-size: 0.95rem; margin-bottom: 0.25rem; }
    input, select {
      width: 100%;
      padding: 0.4rem;
      border: 1px solid #ccc;
      border-radius: var(--border-radius);
      font-size: 0.95rem;
      margin-bottom: var(--gap);
    }
    button {
      background: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: var(--border-radius);
      padding: 0.4rem 0.6rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s;
      display: inline-block;
      margin: var(--gap) 0 0;
    }
    button:hover { opacity: 0.9; }
    .remove-btn {
      background: var(--danger-color);
      padding: 0.3rem 0.5rem;
      font-size: 0.8rem;
    }
    .group {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      padding: var(--gap);
      margin-bottom: var(--gap);
    }
    .bartenders-group {
      border: 2px solid var(--primary-color);
    }
    .dynamic-group {
      border: 1px solid #ccc;
    }
    .flex-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--gap);
      margin-bottom: var(--gap);
    }
    .flex-row input { flex: 1 1 calc(50% - var(--gap)); }
    .star-options {
      display: flex;
      gap: var(--gap);
      margin-bottom: var(--gap);
    }
    .summary {
      background: var(--card-bg);
      padding: var(--gap);
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      font-size: 0.95rem;
      line-height: 1.4;
      margin-top: var(--gap);
    }
    .highlight {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 700;
      font-size: 1.1em;
      text-align: center;
    }
    @media (max-width: 480px) {
      .flex-row input { flex: 1 1 100%; }
      body { padding: 0.5rem; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <h1>מחשבון חלוקת טיפים</h1>
  <label for="totalTip">סה"כ טיפים (₪):</label>
  <input type="number" id="totalTip" placeholder="הזן סכום טיפים" />
  <label for="isWeekend"><input type="checkbox" id="isWeekend" /> סופ"ש?</label>

  <div class="group bartenders-group">
    <h3>ברמנים</h3>
    <div id="barContainer"></div>
    <button onclick="addWorker('bar')">➕ הוסף ברמן</button>
  </div>
  <div class="group">
    <h3>מלצרים</h3>
    <div id="waiterContainer"></div>
    <button onclick="addWorker('waiter')">➕ הוסף מלצר</button>
  </div>
  <button onclick="calculateTips()">חשב חלוקה</button>
  <div class="summary" id="results"></div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.barCount = 0;
      window.waiterCount = 0;
      addWorker('bar');
      addWorker('waiter');
    });

    function addWorker(type) {
      const container = document.getElementById(type + "Container");
      const id = type === 'bar' ? window.barCount++ : window.waiterCount++;
      const div = document.createElement("div");
      div.className = "group dynamic-group";
      div.innerHTML = `
        <div class="flex-row">
          <input placeholder="שם" id="${type}Name${id}" />
          <input type="number" placeholder="שעות עבודה" id="${type}Hours${id}" />
        </div>
        <label><input type="checkbox" id="${type}HasStars${id}" onchange="toggleStars('${type}',${id})" /> כוכבים?</label>
        <div class="star-options" id="${type}StarsOptions${id}" style="display:none">
          <label><input type="radio" name="${type}Stars${id}" value="3" /> 3⭐</label>
          <label><input type="radio" name="${type}Stars${id}" value="4" /> 4⭐</label>
          <label><input type="radio" name="${type}Stars${id}" value="5" /> 5⭐</label>
        </div>
        <button class="remove-btn" onclick="this.parentElement.remove()">🗑️ הסר</button>
      `;
      container.appendChild(div);
    }

    function toggleStars(type, id) {
      const box = document.getElementById(`${type}StarsOptions${id}`);
      box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    }

    function getWorkers(type) {
      const container = document.getElementById(type + "Container");
      const divs = [...container.querySelectorAll(".group.dynamic-group")];
      return divs.map((div, i) => {
        const name = div.querySelector(`input[id^=${type}Name]`)?.value || `עובד ${i+1}`;
        const hours = parseFloat(div.querySelector(`input[id^=${type}Hours]`)?.value) || 0;
        let stars = 6;
        const hasStars = div.querySelector(`input[id^=${type}HasStars]`)?.checked;
        if (hasStars) {
          const sel = div.querySelector(`input[name^=${type}Stars]:checked`);
          if (sel) stars = parseInt(sel.value, 10);
        }
        return hours > 0 ? {name, hours, stars} : null;
      }).filter(Boolean);
    }

    function calculateTips() {
      const totalTip = parseFloat(document.getElementById("totalTip").value) || 0;
      const isWeekend = document.getElementById("isWeekend").checked;
      const barTipPercent = isWeekend ? 0.15 : 0.12;

      const barWorkers = getWorkers("bar");
      const waiters = getWorkers("waiter");

      const barTip = totalTip * barTipPercent;
      const remainingAfterBar = totalTip - barTip;

      // אם אין מלצרים או שאין שעות — מנגנון הגנה
      const totalHours = waiters.reduce((sum, w) => sum + w.hours, 0);
      if (totalTip <= 0 || totalHours <= 0) {
        document.getElementById("results").innerHTML = "<div>נא להזין טיפ חיובי ולפחות מלצר אחד עם שעות > 0.</div>";
        return;
      }

      // קביעה קונסיסטנטית של אחוז מסעדה לפי השכר השעתי לאחר ההפרשה:
      // avgHourly = (remainingAfterBar * (1 - p)) / totalHours
      // קודם נבדוק 20%: אם avgHourly_20 ≥ 100 ⇒ 20%
      // אחרת נבדוק 17%: אם avgHourly_17 ≥ 90 ⇒ 17%
      // אחרת 15%.
      const avgHourlyWith = (p) => (remainingAfterBar * (1 - p)) / totalHours;

      let restPercent;
      if (avgHourlyWith(0.20) >= 100) {
        restPercent = 0.20;
      } else if (avgHourlyWith(0.17) >= 90) {
        restPercent = 0.17;
      } else {
        restPercent = 0.15;
      }

      const restCut = remainingAfterBar * restPercent;
      const finalForWaiters = remainingAfterBar - restCut;

      // חלוקה למלצרים לפי "שעות*כוכבים"
      const effUnits = waiters.reduce((sum, w) => sum + w.hours * w.stars, 0);
      const perEffUnit = effUnits ? (finalForWaiters / effUnits) : 0;
      const tips = waiters.map(w => w.hours * w.stars * perEffUnit);
      const avgHourlyWage = finalForWaiters / totalHours;

      // חלוקת בר: אם בחרת להשתמש בכוכבים גם בבר — נשאיר סימטרי (שעות*כוכבים). אם לא סומן כוכבים — הכוכבים נשארים 6 ברירת מחדל בדיוק כפי שהקוד עבד.
      const totalBarUnits = barWorkers.reduce((s, w) => s + w.hours * w.stars, 0);
      const perBarUnit = totalBarUnits ? (barTip / totalBarUnits) : 0;
      const barTipsArr = barWorkers.map(w => w.hours * w.stars * perBarUnit);

      let html = `
        <span class="highlight">סיכום כללי:</span>
        <div>סה"כ טיפ: ₪${totalTip.toFixed(2)}</div>
        <div>הפרשה לבר: ₪${barTip.toFixed(2)} (${(barTipPercent*100).toFixed(0)}%)</div>
        <div>הפרשה למסעדה: ₪${restCut.toFixed(2)} (${(restPercent*100).toFixed(0)}%)</div>
        <div>טיפ נטו למלצרים: ₪${finalForWaiters.toFixed(2)}</div>
        <div>שכר שעתי ממוצע למלצרים (לאחר ההפרשה): ₪${avgHourlyWage.toFixed(2)}</div>
        <hr/>
        <span class="highlight">פירוט לפי עובד:</span>
        <strong>מלצרים:</strong>
        ${waiters.map((w,i) => `
          <div>${w.name}: ₪${tips[i].toFixed(2)} (ש"ש: ₪${(w.hours ? (tips[i]/w.hours) : 0).toFixed(2)})</div>
        `).join('')}
        <strong>ברמנים:</strong>
        ${barWorkers.map((w,i) => `
          <div>${w.name}: ₪${barTipsArr[i].toFixed(2)} (ש"ש: ₪${(w.hours ? (barTipsArr[i]/w.hours) : 0).toFixed(2)})</div>
        `).join('')}
      `;

      document.getElementById("results").innerHTML = html;
    }
  </script>
</body>
</html>
